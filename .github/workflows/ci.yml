name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify vendored inputs are unmodified
        run: shasum -a 256 -c vendor/CHECKSUMS.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run gen:schemas
      - run: npm run gen:paths
      - name: Fail if generated output drifted from the committed tree
        run: git diff --exit-code -- spec/paths/_generated spec/components/schemas/_generated
      - run: npm run bundle
      - run: npm run lint:spec
      - run: npm test
      - run: npm run coverage

  publish:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run bundle && npm run build:site
      # enablement:true keeps Pages configured once a site already exists. It
      # does NOT create the first one: on a fresh repo or a new fork this step
      # fails with "Create Pages site failed. Error: Resource not accessible by
      # integration", because the Actions token is not permitted to create a
      # Pages site even with `pages: write` declared above. Someone with repo
      # admin rights has to create it once -- Settings -> Pages, or
      # `gh api repos/<owner>/<repo>/pages -X POST -f build_type=workflow` --
      # after which this job succeeds unchanged. Observed on this repository
      # after it was deleted and recreated: `check` passed, `publish` failed
      # with exactly that error, and a re-run of the same commit went green
      # once the site had been created out of band.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
