# Refined from _generated/OccupancySettings.yaml. Two deviations:
#
# 1. `PresetAssignmentUnsupported` relaxed to optional. Firmware marks it
#    non-pointer (`PresetAssignmentUnsupported bool`), so the generated schema
#    required it; the one observed instance omits it. Same direction of
#    inference Organization.yaml and LoadController.yaml record -- an observed
#    absence falsifies a non-pointer `required`, while presence on a small
#    sample is not evidence for one. `EnabledState` (also non-pointer) is
#    present and stays required.
#
# 2. `EnabledState` points at the shared EnabledState schema rather than the
#    generated inline open string. Firmware types the field
#    `EnabledState leapobj.EnabledState` -- the same named type, and the same
#    type-identity basis EnabledState.yaml records for its other users; the
#    one observed value, `Disabled`, is a member.
type: object
description: |
  Occupancy behaviour for an area.

  **The whole evidence base for this schema is one object.** Only the two
  coverage-blind spec probes ever requested any `/area/*occupancysettings`
  URL, 9 requests each -- the collection route plus 8 area ids. Two of
  Caseta v01.123's 9 came back with a body
  (`fixtures/spec-read-caseta.json`), and they carry the same object:
  `/area/2/occupancysettings`, `{"href": ..., "Parent": {...},
  "EnabledState": "Disabled", "IsStagedOccupancyEnabled": false}`, and the
  `/area/occupancysettings` collection whose sole element is byte-identical
  to it. **Two bodies, one object.** RA3 v03.249 answers the collection route
  `204 NoContent` and all 8 per-area requests `404 NotFound`; the original
  campaign corpora and the sweep corpora never requested these URLs at all.

  Six of the ten fields are absent from that object. Five of the six are
  pointers in firmware, so their absence is unremarkable: `Follows`,
  `OccupancyMode`, and the three OccupancySettingsAction slots (`Occupied`,
  `Unoccupied`, `PartiallyOccupied`), which is consistent with occupancy
  being `Disabled` on it. The sixth is `PresetAssignmentUnsupported`, the
  non-pointer relaxed above -- that one absence is a firmware/hardware
  disagreement, the other five are not. Nothing in this corpus exercises the
  action slots, so OccupancySettingsAction enters the bundle entirely
  untriaged -- see its own file.
properties:
  href:
    type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  Follows:
    $ref: "#/components/schemas/HyperReference"
  Occupied:
    $ref: "#/components/schemas/OccupancySettingsAction"
  Unoccupied:
    $ref: "#/components/schemas/OccupancySettingsAction"
  OccupancyMode:
    type: string
    description: |
      TODO(enum): members of OccupancyMode were not recovered from the
      firmware extraction, and hardware has produced none either -- the one
      observed OccupancySettings omits this pointer field.
  EnabledState:
    $ref: "#/components/schemas/EnabledState"
  PartiallyOccupied:
    $ref: "#/components/schemas/OccupancySettingsAction"
  PresetAssignmentUnsupported:
    type: boolean
  IsStagedOccupancyEnabled:
    type: boolean
required:
  - EnabledState
