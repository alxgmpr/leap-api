type: string
description: |
  Whether a shade button group stops movement when a new command arrives.
  The firmware extraction did not recover the full enum; the only member
  below was recovered from ButtonGroup.StopIfMoving observed on Caseta --
  21 instances across the three Caseta corpora: 19 from the original
  v01.123 capture (via /buttongroup and /device/{deviceId}/buttongroup),
  1 from the v01.123 coverage-blind spec probe, and 1 from the v01.124
  bare-bridge probe, on the button group a bridge with no devices still
  reports at /device/1/buttongroup. Never observed on either RA3
  corpus in any context (always absent), and never observed as anything but
  `Disabled` on Caseta -- an `Enabled` counterpart is expected by the field
  name but unconfirmed in any fixture. Unlisted values are possible.
enum:
  - Disabled
