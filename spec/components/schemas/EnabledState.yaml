type: string
description: |
  Enabled/disabled toggle. The firmware extraction did not recover the full
  enum (multiple properties across the API -- Server.EnableState,
  NaturalLightOptimizationStatus.EnabledState, TimeclockStatus.EnabledState,
  TimeclockEventStatus.EnableState, and others -- reference this same named
  type as an open string); members below were recovered from
  Server.EnableState (RA3 v03.247, Caseta v01.123),
  NaturalLightOptimizationStatus.EnabledState (Caseta v01.123), and
  TimeclockStatus.EnabledState (RA3 v03.247, via /timeclock/status).
  TimeclockEventStatus.EnableState is typed against this same schema by
  type-identity (matching marker text); the coverage-blind spec probe has
  since given it direct coverage too (7 x `Enabled`, RA3 v03.249, via
  /timeclockevent/{id}/status). Unlisted values are possible.

  Six further fields whose firmware type is this same `leapobj.EnabledState`
  were pointed here on type-identity in the Task 13 enum pass:
  AssociatedNetworkInterface.EnabledState, DataShippingRule.EnabledState,
  SOCKS5ProxyProperties.EnabledState, and the `AutoVibrancy` property of
  DimmedLevelParameters, SpectrumTuningLevelParameters, and VibrancyStatus.
  Only SOCKS5ProxyProperties has direct coverage of its own (1 x `Disabled`,
  RA3 v03.249, nested under /networkinterface/1); the other five carry no observed
  value in any corpus and take their members from the shared type, not from
  evidence at their own site.

  The area-settings family added two more on the same type-identity basis,
  both with direct coverage: DaylightingGainSettings.EnabledState (1 x
  `Enabled`) and OccupancySettings.EnabledState (1 x `Disabled`), each on
  the single object of its type that Caseta v01.123's coverage-blind spec
  probe returned. The zone family added a third, CountdownTimer.EnabledState
  (11 x `Enabled`, every countdown timer in the original Caseta capture),
  and the device family a fourth, LEDSpecificSettings.EnabledState -- 30
  values across the two **v01.123** Caseta corpora (`Enabled` 26,
  `Disabled` 4), the best-covered of the type-identity additions. The
  v01.124 bare-bridge corpus adds none of those: it answers
  /device/{deviceId}/ledsettings `404 NotFound` on all 8 ids it asked, so
  the count is unchanged and the qualifier is what moved.
enum:
  - Enabled
  - Disabled
