# `required` dropped entirely: firmware marks Channel and DefaultChannel
# non-pointer, but they're populated in only 3 of 93 observed RFProperties
# objects (both platforms) -- the 3 that hang directly off a top-level Link
# (LinkType RF, e.g. /link/439). The 90 nested inside LinkNode/
# LinkNodeExpanded (link family) are empty objects with neither field. Not a
# platform split; a context split this schema can't express structurally,
# so both are relaxed to optional. Originally copied unmodified as part of
# the device family's transitive closure; corrected here once link-family
# fixtures exposed the disagreement.
type: object
properties:
  ChannelSet:
    $ref: "#/components/schemas/ChannelSet"
  Repeater:
    $ref: "#/components/schemas/Repeater"
  Channel:
    type: integer
    minimum: 0
    maximum: 4294967295
  DefaultChannel:
    type: integer
    minimum: 0
    maximum: 4294967295
  SubnetAddress:
    type: integer
    minimum: 0
    maximum: 65535
