# `LevelState` points at the shared BatteryLevelState schema rather than
# shipping as an open string: 83 observations across both platforms and all
# three read corpora produce two values, `Unknown` (67) and `Good` (16).
# See BatteryLevelState.yaml.
type: object
properties:
  LevelState:
    $ref: "#/components/schemas/BatteryLevelState"
required:
  - LevelState
