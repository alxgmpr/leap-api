type: string
description: |
  Discriminator for how a schedule's timing is determined. The firmware
  extraction did not recover the full enum (ActionSchedule.ScheduleType and
  TimeclockEvent.ScheduleType both reference this same named type as an
  open string, despite the differing schemas); members below were
  recovered from ActionSchedule.ScheduleType (Caseta v01.123, 48 instances
  via /occupancygroup and /occupancygroup/{occupancygroupId}, always
  `None`) and TimeclockEvent.ScheduleType (RA3 v03.247, 2 instances via
  /timeclockevent, always `DayOfWeek`). Unlisted values are possible.
enum:
  - None
  - DayOfWeek
