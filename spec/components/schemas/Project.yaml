type: object
description: |
  Firmware marks `GUID` non-pointer (always present), but the RA3 v03.247
  instance omits it (Caseta v01.123's instance has it) -- a platform
  disagreement, not an omission error, relaxed to optional on hardware
  evidence.
properties:
  href:
    type: string
  Name:
    type: string
  ProductType:
    $ref: "#/components/schemas/ProductType"
  MasterDeviceList:
    $ref: "#/components/schemas/DeviceReferences"
  Contacts:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  GUID:
    type: string
  TimeclockEventRules:
    $ref: "#/components/schemas/HyperReference"
  DeviceRules:
    $ref: "#/components/schemas/HyperReference"
  ProjectModifiedTimestamp:
    $ref: "#/components/schemas/Timestamp"
required:
  - Name
  - ProductType
