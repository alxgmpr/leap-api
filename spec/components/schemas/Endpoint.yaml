type: object
description: |
  Firmware marks `AssociatedNetworkInterfaces` as an array (never null), but
  every observed Endpoint (RA3 v03.247, Caseta v01.123, via /server) carries
  it as literal JSON `null` rather than an empty array or an omitted key.
  Widened to accept null on hardware evidence; a populated array is
  unconfirmed in either fixture.
properties:
  Protocol:
    $ref: "#/components/schemas/Protocol"
  Port:
    type: integer
    minimum: 0
    maximum: 4294967295
  AssociatedNetworkInterfaces:
    type:
      - array
      - "null"
    items:
      $ref: "#/components/schemas/AssociatedNetworkInterface"
required:
  - Protocol
  - Port
