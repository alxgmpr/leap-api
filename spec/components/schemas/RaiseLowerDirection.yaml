type: string
description: |
  Raise/lower direction for a single-scene raise or lower programming
  model. The firmware extraction did not recover the full enum; members
  below were recovered from ProgrammingModel.Direction observed on Caseta
  v01.123 (12 instances: 6 `Raise`, 6 `Lower`), via /programmingmodel.
  Never observed on RA3 v03.247. Unlisted values are possible.
enum:
  - Raise
  - Lower
