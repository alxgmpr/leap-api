# `required` trimmed: firmware marks ConfigurationStateRevision non-pointer,
# but the only observed Database object (nested inside a Device, RA3
# /database/@Project) omits it. Sample size is 1 (Database is not itself a
# directly-fetched route in this family), but a genuine 200 body is enough
# to falsify "always present". Relaxed to optional.
type: object
properties:
  href:
    type: string
  Type:
    type: string
    description: |
      TODO(enum): members of DatabaseType were not recovered from the
      firmware extraction, and hardware has produced exactly one: `Project`,
      on both RA3 corpora and neither Caseta one, always nested inside a
      Device -- via /project/masterdevicelist/devices, via /device/435, and
      via the `Parent` device of two entries in
      /link/{439,437}/associatedlinknode/expanded. Four occurrences per RA3
      corpus, of what the header comment records as a single database object;
      the per-corpus counts are under `x-observed-census`. A processor that
      distinguishes database *types* plainly has more than one; the probes
      only ever reach the project database.
    x-observed-values:
      - Project
    x-observed-census:
      Project:
        ra3: 4
        spec-read-ra3: 4
  Version:
    $ref: "#/components/schemas/DatabaseVersion"
  TransferGUID:
    type: string
  ConfigurationStateRevision:
    type: string
  UnsynchronizedChanges:
    $ref: "#/components/schemas/UnsynchronizedChanges"
  InstalledOnDevices:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
required:
  - Type
