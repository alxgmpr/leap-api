type: string
description: |
  Contact's role on the project. The firmware extraction did not recover
  the full enum; the member below was recovered from Contact.Role via
  /project/contactinfo, and is now observed three times across both
  platforms -- RA3 v03.247, RA3 v03.249 and Caseta v01.123 -- on two
  distinct contact records. Unlisted values are possible; a one-member set
  closed on one distinct value is a lower bound, and this specification has
  had such a set falsified before (see `OccupancyStatus.yaml`).
enum:
  - Installer
