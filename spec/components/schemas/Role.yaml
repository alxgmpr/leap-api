# HAND-AUTHORED. Shipped as a closed one-member `enum` until this pass --
# see the description for why it is an open string now.
type: string
description: |
  Contact's role on the project, from `Contact.Role` (firmware type
  `leapobj.Role`) via /project/contactinfo.

  **Open string, not an enum.** This shipped as a closed **one-member**
  `enum`, and one member is the case where the `enum` adds nothing:
  `enum: [Installer]` and `x-observed-values: [Installer]` assert the same
  *content*. The only thing the `enum` adds is "and nothing else, ever" --
  an exhaustiveness claim on a sample that has never once shown this field
  to vary. Opening drops that and loses no evidenced content, and it moves
  the claim somewhere machine-checked in both directions
  (`test/observed-values.test.ts`), which the `enum` never was for
  frame-log bodies.

  **That is not a general licence to reopen**, and the limit is stated here
  so this file does not read as one. 24 closed enums still ship in this
  specification, every one beside a note of its own saying the member list
  is not exhaustive, and they stay closed because something evidences the
  extent of their set: 23 have every declared member independently observed
  in the fixtures, and `CommandType` has a documented non-wire source for
  its 39 (decompiled Lutron app binaries), of which only
  `PressAndRelease` was ever seen on the wire. This field had neither: one
  observed value, and no member list from anywhere else. Firmware typing
  does not separate the cases -- it is typed
  `leapobj.Role`, a named type the extraction
  never defined, and so is every one of those 24. See
  `OccupancyStatus.yaml`, which records the criterion in full and the
  ruling it reverses.

  Three occurrences on two distinct contact records, counted per corpus
  under `x-observed-census`: RA3 v03.247 and the RA3 v03.249 spec probe both
  return `/contactinfo/102` -- byte-identical bodies, so a second
  observation of one record rather than a second record -- and the Caseta
  v01.123 spec probe returns `/contactinfo/1`, which is genuinely different.
  The original Caseta capture and the v01.124 bare-bridge probe answer this
  route `204 NoContent` and contribute none. See `Contact.yaml`.
x-observed-values:
  - Installer
x-observed-census:
  Installer:
    ra3: 1
    spec-read-caseta: 1
    spec-read-ra3: 1
