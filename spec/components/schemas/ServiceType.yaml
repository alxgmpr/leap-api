# HAND-AUTHORED (formerly a closed 8-member enum -- see the description).
# Opened because hardware falsified the closed set and nothing else
# evidences its extent; the firmware typing below corroborates rather than
# decides. `Service.Type` is a bare `string` (vendor/leap-types.json: `type
# leapobj.Service struct { ... Type string ... }`, no named enum type at
# all), so there was never a member list for the generator to recover.
type: string
description: |
  Discriminator for `Service.Type`, naming which `*Properties` field (if
  any) is populated on the same object -- see `Service.yaml`.

  **Open string, not an enum.** This field carried a closed 8-member `enum`
  until hardware falsified it: the coverage-blind spec probe's `/service`
  collection (RA3 v03.249 -- see docs/platforms.md) returned a ninth value,
  `{"href": "/service/cloud",
  "Type": "Cloud"}`, alongside the same seven the earlier RA3 capture
  showed. That enum's own description already said the members were
  observed-not-exhaustive and that an unlisted service type "must still
  validate" -- a promise a closed `enum` cannot keep, and did not. The
  contradiction is resolved in favor of what the description always said
  the field was.

  **The operative ground is falsification, plus the absence of anything
  evidencing the set's extent** -- the criterion `OccupancyStatus.yaml`
  records in full. This file is that criterion's worked example, and it is
  worth being precise about why, because the obvious reading is wrong.

  The obvious reading is that the enum was weakly evidenced. It was not. All
  8 declared members -- Alexa, GoogleHome, BACnet, HomeKit, IFTTT, Sonos,
  NTPServer, AutoProgrammer -- had been independently observed on hardware
  before it was closed. That is the same ground on which 23 closed enums
  still ship, satisfied in full, and hardware falsified it regardless.
  "Every declared member was observed" says nothing about whether an
  undeclared member exists, which is the whole lesson: every closed enum in
  this specification is a lower bound, and a later corpus can contradict any
  of them.

  What decides **reopened** rather than **extended** is whether anything
  else evidences the extent of the set. Nothing does here, so it reopens.
  `ServerType` was falsified the same way by the Caseta bridge and was
  extended instead, because its members are all independently observed and
  the type system had independently evidenced the missing one. This file
  and that one are the two halves of the split.

  **The bare-`string` typing corroborates, it does not decide.** There is
  no `leapobj.ServiceType` at all -- the field is a bare Go `string` --
  which is a real difference from `ProgrammingModelType` or
  `AddressedState`, and it is why there was never a generator-recoverable
  member list. But firmware typing does not separate open from closed
  anywhere in this specification: the extraction recovers `struct`
  definitions only and never defines a named enum type, so it cannot bound
  any member set, and all 24 closed enums are named types it never defined.

  The values here are whichever integrations a particular processor's
  firmware build and feature set have provisioned.
  The two RA3 corpora this project has captured do not agree on that list --
  same project, two firmware builds, one extra integration on the later one
  -- which is the same kind of per-installation, per-build divergence
  docs/platforms.md records for route availability. Appending `Cloud` to a
  closed enum would have re-armed the identical failure for the next
  unobserved integration.

  Values observed to date, retained below under `x-observed-values` as
  documentation rather than as an assertion (RA3 v03.247: Alexa,
  GoogleHome, BACnet, HomeKit, IFTTT, Sonos, NTPServer; RA3 v03.249, the
  spec probe: those seven plus Cloud; Caseta: Sonos, HomeKit, Alexa,
  GoogleHome, AutoProgrammer, IFTTT, the same six on all three corpora --
  v01.123 twice and the wiped v01.124 bridge, which provisions no fewer
  integrations for having no devices). Per-corpus occurrence counts are
  under `x-observed-census`; a value appearing more than once in a corpus is
  the /service collection and the per-type /service/{type} route serving the
  same entry. A value outside this
  list is expected
  and validates -- consistent with `Service.yaml`, which does not set
  `additionalProperties: false`.
x-observed-values:
  - Alexa
  - GoogleHome
  - BACnet
  - HomeKit
  - IFTTT
  - Sonos
  - NTPServer
  - AutoProgrammer
  - Cloud
