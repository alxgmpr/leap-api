# HAND-AUTHORED (formerly a closed 8-member enum -- see the description).
# Opened because hardware falsified the closed set and the firmware never
# modelled that set at all: `Service.Type` is a bare `string`
# (vendor/leap-types.json: `type leapobj.Service struct { ... Type string
# Body json.RawMessage }`, no named enum type anywhere), so there is nothing
# for a later value to converge on and never was a member list for the
# generator to recover.
type: string
description: |
  Discriminator for `Service.Type`, naming which `*Properties` field (if
  any) is populated on the same object -- see `Service.yaml`.

  **Open string, not an enum.** This field carried a closed 8-member `enum`
  until hardware falsified it: the coverage-blind spec probe's `/service`
  collection (RA3 v03.249 -- see docs/platforms.md) returned a ninth value,
  `{"href": "/service/cloud",
  "Type": "Cloud"}`, alongside the same seven the earlier RA3 capture
  showed. That enum's own description already said the members were
  observed-not-exhaustive and that an unlisted service type "must still
  validate" -- a promise a closed `enum` cannot keep, and did not. The
  contradiction is resolved in favor of what the description always said
  the field was.

  **The operative ground is falsification, plus the fact that the firmware
  never modelled this set at all** -- the criterion `OccupancyStatus.yaml`
  records in full. This file is that criterion's worked example on the
  reopen side, and it is worth being precise about why, because the obvious
  reading is wrong.

  The obvious reading is that the enum was weakly evidenced. It was not. All
  8 declared members -- Alexa, GoogleHome, BACnet, HomeKit, IFTTT, Sonos,
  NTPServer, AutoProgrammer -- had been independently observed on hardware
  before it was closed. That is the same ground on which 23 closed enums
  still ship, satisfied in full, and hardware falsified it regardless.
  "Every declared member was observed" says nothing about whether an
  undeclared member exists, which is the whole lesson: every closed enum in
  this specification is a lower bound, and a later corpus can contradict any
  of them.

  What decides **reopened** rather than **extended** is whether the firmware
  models the field with a named type at all. Falsification establishes that
  the old list was short, not by how much, and a named `leapobj.*` type
  means a closed set does exist in the firmware for later observations to
  converge on -- this project simply cannot enumerate it, because the
  extraction recovers Go `struct` definitions only. `ServerType`,
  `ProgrammingModelType` and `OccupancyStatus` were all falsified and all
  extended on that ground. This file is the only reopen, and the only
  bare-`string` field this specification ever shipped a closed `enum` on, so
  it is the whole of that branch.

  **There is nothing here to converge on.** `leapobj.Service` is
  `Type string` beside `Body json.RawMessage`: no named type for the
  discriminator, and an untyped blob where `leapobj.Server` has a field per
  member. There is no per-`Type` list to enumerate against -- the seven
  `*Properties` fields modeled in `Service.yaml` were recovered from the
  wire, not from that struct.

  The corpus says the same thing independently, and said it before `Cloud`
  arrived. The values here are whichever integrations a particular
  processor's firmware build and feature set have provisioned, so the
  8-member list was a **union no single unit ever exposed**: RA3 v03.247
  carried 7 (Alexa, BACnet, GoogleHome, HomeKit, IFTTT, NTPServer, Sonos)
  and Caseta v01.123 a different 6 (those minus BACnet and NTPServer, plus
  AutoProgrammer), sharing 5. The two RA3 corpora do not agree either --
  same project, two firmware builds, one extra integration on the later one
  -- which is the same kind of per-installation, per-build divergence
  docs/platforms.md records for route availability. Appending `Cloud` to a
  closed enum would have re-armed the identical failure for the next
  unobserved integration.

  **What the bare-`string` typing does and does not settle.** It settles the
  reopen-versus-extend question above: there is no `leapobj.ServiceType` at
  all, so there is no firmware set for a ninth or tenth value to converge
  on, and that is a real difference from `ProgrammingModelType` or
  `AddressedState`. It settles nothing about whether a closed `enum` should
  have shipped in the first place -- all 24 closed enums here are named
  types the extraction never defined, and so were the five one-member fields
  this specification opened, so typing cannot separate those. The two
  questions have to be read separately; the older criterion in this
  specification ran them together.

  Values observed to date, retained below under `x-observed-values` as
  documentation rather than as an assertion (RA3 v03.247: Alexa,
  GoogleHome, BACnet, HomeKit, IFTTT, Sonos, NTPServer; RA3 v03.249, the
  spec probe: those seven plus Cloud; Caseta: Sonos, HomeKit, Alexa,
  GoogleHome, AutoProgrammer, IFTTT, the same six on all three corpora --
  v01.123 twice and the wiped v01.124 bridge, which provisions no fewer
  integrations for having no devices). Per-corpus occurrence counts are
  under `x-observed-census`; a value appearing more than once in a corpus is
  the /service collection and the per-type /service/{type} route serving the
  same entry. A value outside this
  list is expected
  and validates -- consistent with `Service.yaml`, which does not set
  `additionalProperties: false`.
x-observed-values:
  - Alexa
  - GoogleHome
  - BACnet
  - HomeKit
  - IFTTT
  - Sonos
  - NTPServer
  - AutoProgrammer
  - Cloud
