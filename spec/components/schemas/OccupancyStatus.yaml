type: string
description: |
  Current occupancy reading for an area or occupancy group. The firmware
  extraction did not recover the full enum; the members below are every
  value observed on the wire, and unlisted values are possible.

  This schema shipped with a single member, `Unknown`, recovered from
  OccupancyGroupStatus.OccupancyStatus on Caseta v01.123 (25 instances,
  still, across the three Caseta corpora -- 24 from the original capture
  and 1 from the v01.123 coverage-blind spec probe; the v01.124 bare-bridge
  probe adds none, because a bridge with no devices has no occupancy groups
  and answers /occupancygroup/status `204 NoContent`) via
  /occupancygroup/status,
  hand-authored, see occupancygroup.yaml; never observed on RA3, which
  answers 204 NoContent on that route). Its
  description called that a single-value, single-platform sample and said
  `Occupied` and `Unoccupied` counterparts were "expected by the concept but
  unconfirmed in either fixture".

  The coverage-blind spec probe confirmed both, on the other field carrying
  this same firmware type (`leapobj.OccupancyStatus`):
  AreaStatus.OccupancyStatus across the 8 areas the RA3 v03.249 probe
  reaches gives `Unknown` 4
  (/area/{3,32,1232,1256}/status), `Unoccupied` 3
  (/area/{1208,1220,1244}/status), and `Occupied` 1 (/area/912/status).

  `fixtures/push-probe.json` supplies a ninth, `Unoccupied` on
  /area/1340/status -- an area none of those eight covers. Which frame it is
  matters: it is the **subscribe-time snapshot**, `seq` 19,
  `CommuniqueType: SubscribeResponse`, `MessageBodyType: OneAreaStatus`,
  `deliveredToOnEvent: false` -- not one of the pushes that followed. None
  of the three `/area/1340/status` pushes in that capture (`seq` 22, 23 and
  26) carries `OccupancyStatus` at all: push bodies are field-level deltas,
  so a field absent from every push is one the processor never reported
  changing. (The capture cannot say more than that -- its closing read,
  `seq` 27, is a zone read, so the area's end-state occupancy was never
  re-read.) That is
  the same fact `docs/subscriptions.md` uses to show that `AreaStatus`'s
  `required: [OccupancyStatus]` does not hold for push frames, so the
  snapshot/push distinction is load-bearing here rather than bookkeeping.

  Worth keeping in view when reading the rest of this specification: a
  single-member enum here was one probe away from being falsified, which is
  why the enum pass that added these two members left the remaining
  single-observation enum fields as open strings rather than closing them
  on the same kind of evidence -- see `ZoneStatus.yaml`, which records that
  argument in full.

  This is not the only single-observation closure the specification has
  carried, just the only one hardware has falsified. `Role`, `SessionRole`,
  `ButtonGroupCategoryType`, `StopIfMovingEnabledState` and
  `SystemLoadSheddingState` all predate this pass and all shipped closed on
  one distinct observed value each.

  **All five are now open strings, which reverses the ruling this paragraph
  used to record.** That ruling left them closed because "reopening on
  suspicion would assert an absence no corpus has observed", and it had the
  burden backwards. Opening asserts nothing: `type: string` beside
  `x-observed-values` records what was seen and claims nothing about what
  was not. It is the closed `enum` that asserts, and what it asserts is
  exhaustiveness. For a one-member set the two carry the same *content* --
  `enum: [X]` and `x-observed-values: [X]` list the same value -- so opening
  drops one unevidenced assertion and loses no evidenced one. It also moves
  the claim somewhere machine-checked: `test/observed-values.test.ts`
  cross-references every `x-observed-values` list against the fixtures in
  both directions, and `x-observed-census` does the same for the counts,
  where a closed `enum` was checked against probe-set bodies only and
  against frame-log bodies not at all.

  **THE CRITERION IS SET CARDINALITY, not firmware typing.** It is stated
  here in full because it is applied to five files and deliberately not
  applied to twenty-four others, and a rule that looks general while being
  half-applied is worse than no rule.

  - A **one-member** closed enum asserts exhaustiveness on a sample that has
    never once shown the field to vary. `enum: [X]` and
    `x-observed-values: [X]` assert the same *content*, so opening drops
    only the unevidenced half and takes nothing from a consumer. One
    observed value does not distinguish an enum from a constant, which is
    the argument `ZoneStatus.yaml` records in full.
  - A **multi-member** closed enum is different in kind. Each of its members
    was independently observed, so the field has demonstrated that it
    varies, and the enum carries real discriminating content. Those stay
    closed, as acknowledged lower bounds -- which is what "unlisted values
    are possible" beside a closed `enum` means in this specification: not a
    contradiction to be resolved, but a statement that the member list is a
    floor.

  The rule is fully applied rather than half-applied: **no one-member closed
  enum remains anywhere in `spec/components/schemas/`.** The 24 that stay
  closed carry between 2 and 39 members, and 23 of the 24 sit beside the
  same "unlisted values are possible" note these five carried.

  **Firmware typing cannot do this work**, which is worth saying because the
  older criterion in this specification -- a bare Go `string` opens, a named
  enum whose members the extraction failed to recover stays closed as a
  lower bound -- would have kept all five closed. All 24 remaining closed
  enums are named `leapobj.*` types, referenced at field positions and never
  defined by the extraction: exactly the status of these five. It does not
  separate them.

  What the extraction does settle is that it never bounds anything. It
  recovers Go `struct` definitions and nothing else -- `test/vendor.test.ts`
  asserts that of all 636 recovered type values -- and a Go string enum is
  `type X string` plus consts, a form it never emitted. At field positions
  it references 455 distinct `leapobj.*` types: 337 of them are among the
  636 structs it defines, and the other 118 it never defines at all. (The
  two sets overlap rather than nest -- 299 recovered structs are never used
  as a field type anywhere, and 337 + 299 = 636.) Those 118 are where every
  enum type this specification names lives, `leapobj.Role`,
  `leapobj.SessionRole`, `leapobj.ButtonGroupCategoryType`,
  `leapobj.StopIfMovingEnabledState`, `leapobj.SystemLoadSheddingState` and
  this file's own `leapobj.OccupancyStatus` among them. So "the firmware
  extraction did not recover the full enum" is true of every enum here by
  construction. It is a fact about the extraction, not evidence about any
  field, and each of the five descriptions opened with it as though it were
  the latter.

  `ServerType.yaml` stays closed under the cardinality rule -- three
  independently observed members -- and its own description should not be
  read as claiming more than it can. `leapobj.Server` carries
  `LIPProperties`, `LEAPProperties` and `IPLProperties` as three distinct
  pointer fields, which evidenced that a **third member exists** before any
  Caseta probe found it. That is genuinely more than the five ever had, but
  it does not evidence that only three exist, and nothing in the extraction
  could. `ServiceType` is the other end of the scale and was opened on
  neither ground: `Service.Type` is a bare Go `string` with no named type at
  all, and hardware falsified the closed set outright.
enum:
  - Occupied
  - Unoccupied
  - Unknown
