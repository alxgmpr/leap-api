type: object
description: |
  FLATTENED `NetworkInterfaceSmallDefinition`, a named field whose Go type
  shares the field name (`NetworkInterfaceSmallDefinition
  leapobj.NetworkInterfaceSmallDefinition`, non-pointer) -- an anonymous
  embed promoted flat onto the wire body, the same class of generator
  defect already recorded for ZoneExpandedStatus (Task 10),
  Device/ButtonGroupExpanded/LinkNodeExpanded (Task 12a), NLOTime (Task
  12b) and TimeclockEvent.

  Decided from the wire body, not from the name==type shape. Both observed
  instances are `/networkinterface/1` from the coverage-blind spec probe,
  one per platform -- RA3 v03.249 and Caseta v01.123, the only two 200 OKs
  any corpus has for this route; every `/device/{deviceId}/networkinterface`
  probe on both platforms answers `400 BadRequest "This request is not
  supported"`, as does the bare `/networkinterface` collection. Both put
  `MACAddress`, `IPv4Properties` and `IPv6Properties` flat at the top level
  next to `AdapterType`:

      RA3 v03.249:
      {"href": "/networkinterface/1", "MACAddress": "...",
       "IPv4Properties": {"Type": "StaticIP", ...},
       "IPv6Properties": {"UniqueLocalUnicastAddresses": [...]},
       "AdapterType": "Ethernet", "SOCKS5ProxyProperties": {...}}

      Caseta v01.123:
      {"href": "/networkinterface/1", "MACAddress": "...",
       "IPv4Properties": {"Type": "DHCP", ...},
       "IPv6Properties": {"UniqueLocalUnicastAddresses": [...]},
       "AdapterType": "Ethernet"}

  There is no `NetworkInterfaceSmallDefinition` key on either, so the
  generated schema's `required: [NetworkInterfaceSmallDefinition]` could
  never be satisfied by any body this route returns. Hardware wins;
  restructured as `allOf` against the embedded type, keeping its own
  `required: [MACAddress]` (present on both instances). The Caseta body
  corroborates the flatten on a second platform and omits
  `SOCKS5ProxyProperties` entirely, which is why that property is optional.

  `NetworkInterfaceSmallDefinition` remains a standalone component rather
  than being inlined: `DeviceMiniDefinitionForMasterDeviceList` holds it as
  a named slice (`NetworkInterfaces []*leapobj.NetworkInterfaceSmallDefinition`),
  which is genuinely nested on the wire -- `/project/masterdevicelist` and
  `/project/masterdevicelist/devices` both return
  `"NetworkInterfaces": [{"MACAddress": ...}]` on RA3. Only this schema's
  embed is flattened.

  `AdapterType` stays required (`"Ethernet"`, 2/2, once per platform). Its
  enum members were not recovered from the firmware and one distinct
  observed value is too thin a base to author one, so it stays an open
  string -- and a WiFi member is not
  hypothetical here, since this same schema carries a `WiFiProperties`
  property that no captured interface populates. The observed value is
  recorded on the field under `x-observed-values`.
allOf:
  - $ref: "#/components/schemas/NetworkInterfaceSmallDefinition"
properties:
  href:
    type: string
  AdapterType:
    type: string
    description: |
      TODO(enum): members of NetworkInterfaceType were not recovered from
      the firmware extraction, and hardware has produced exactly one
      distinct value: `Ethernet`, twice, via /networkinterface/1 on RA3
      v03.249 and on Caseta v01.123. See this schema's description.
    x-observed-values:
      - Ethernet
  WiFiProperties:
    $ref: "#/components/schemas/WiFiProperties"
  SOCKS5ProxyProperties:
    $ref: "#/components/schemas/SOCKS5ProxyProperties"
required:
  - AdapterType
