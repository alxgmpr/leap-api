# Straight copy from _generated/BACnetSettings.yaml -- dependency of
# BACnetProperties.yaml, flattened into it via `allOf` (see that file's
# comment). Matches all three captured instances field-for-field --
# RA3 v03.247 via /service, RA3 v03.249 via /service and /service/bacnet --
# Enabled, NetworkNumber, Port, BBMDIPAddress, BBMDTTL, InstanceStrategy all
# present; DeviceInstance (optional in the firmware) not observed. No Caseta
# corpus carries a BACnet service.
type: object
properties:
  Enabled:
    type: boolean
  NetworkNumber:
    type: integer
    minimum: 0
    maximum: 4294967295
  DeviceInstance:
    type: integer
    minimum: 0
    maximum: 4294967295
  Port:
    type: integer
    minimum: 0
    maximum: 4294967295
  BBMDIPAddress:
    type: string
  BBMDTTL:
    type: integer
    minimum: 0
    maximum: 4294967295
  InstanceStrategy:
    type: string
    description: |
      TODO(enum): members of BACnetInstanceStrategy were not recovered from
      the firmware extraction, and hardware has produced exactly one:
      `Custom`, on RA3 only -- v03.247 via /service, v03.249 via /service and
      /service/bacnet, which is the extra route the coverage-blind probe adds.
      Both Caseta spec probes ask /service/bacnet and get `404 NotFound`.
      Occurrence counts per corpus are under `x-observed-census`. A named
      firmware enum with one observed value stays an open string -- the field
      is called a *strategy*, so whatever the non-custom strategies are named,
      this corpus never provoked one.
    x-observed-values:
      - Custom
    x-observed-census:
      Custom:
        ra3: 1
        spec-read-ra3: 2
required:
  - Enabled
  - NetworkNumber
  - Port
  - BBMDIPAddress
  - BBMDTTL
  - InstanceStrategy
