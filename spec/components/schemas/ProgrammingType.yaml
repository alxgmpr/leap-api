type: string
description: |
  Button group programming layout. The firmware extraction did not recover
  the full enum; members below were recovered from ButtonGroup.ProgrammingType
  observed on RA3 v03.247 (32 instances, all `Freeform`) and Caseta v01.123
  (19 instances: 12 `Column`, 7 `Freeform`), via /buttongroup and
  /device/{deviceId}/buttongroup/expanded. Unlisted values are possible.
enum:
  - Column
  - Freeform
