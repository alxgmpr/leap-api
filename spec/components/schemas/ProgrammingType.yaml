type: string
description: |
  Programming layout, shared by ButtonGroup and OccupancyGroup despite the
  differing schemas (the firmware extraction's marker names the identical
  type for both). The firmware extraction did not recover the full enum;
  members below were recovered from ButtonGroup.ProgrammingType observed on
  RA3 v03.247 (32 instances, all `Freeform`) and Caseta v01.123 (19
  instances: 12 `Column`, 7 `Freeform`), via /buttongroup and
  /device/{deviceId}/buttongroup/expanded, and from
  OccupancyGroup.ProgrammingType observed on Caseta v01.123 (48 instances,
  all `Freeform`), via /occupancygroup and
  /occupancygroup/{occupancygroupId}. Unlisted values are possible.
enum:
  - Column
  - Freeform
