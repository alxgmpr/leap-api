# `required` trimmed: firmware marks Direction and ProgrammingModelType
# non-pointer. Direction is absent on all 54 ProgrammingModel objects
# observed nested inside device-family Buttons (both platforms) --
# relaxed. ProgrammingModelType stayed required through the device family's
# commit (54/54 present there), but the button family's own /button route
# (Caseta v01.123, 105 observed Buttons) falsifies it: Button.ProgrammingModel
# is a bare href-only reference in that context (`{"href":
# "/programmingmodel/N"}`), never carrying ProgrammingModelType. Same
# context-dependent-required shape Task 12a found for RFProperties (full
# when direct-fetched via /programmingmodel, href-only when embedded via
# /button) -- relaxed per the same "any falsifying 200 instance relaxes the
# field" standard. No field in this schema is universally required across
# every context it's embedded in.
type: object
properties:
  href:
    type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  Direction:
    $ref: "#/components/schemas/RaiseLowerDirection"
  ProgrammingModelType:
    $ref: "#/components/schemas/ProgrammingModelType"
  Preset:
    $ref: "#/components/schemas/HyperReference"
  DualActionProperties:
    $ref: "#/components/schemas/DualActionProperties"
  AdvancedToggleProperties:
    $ref: "#/components/schemas/AdvancedToggleProperties"
