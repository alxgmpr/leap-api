# Straight copy from _generated/NTPServerProperties.yaml -- matches the one
# captured instance exactly. Observed on RA3 v03.247, via /service, as the
# flat `NTPServerProperties` key on the array entry with
# `Type: "NTPServer"`: `{"PropertiesType": "Static", "Endpoints": [{"href":
# "/service/ntpserver/1", "Endpoint": "time.iot.lutron.io"}]}`. Not observed
# on Caseta (no `/service/ntpserver` entry in that capture). See
# Service.yaml.
type: object
properties:
  PropertiesType:
    type: string
    description: |
      TODO(enum): members of NTPServerPropertiesType were not recovered
      from the firmware extraction, and hardware has produced exactly one:
      `Static`, on both RA3 units' /service entry for `Type: "NTPServer"`.
      The value's own name implies a non-static counterpart (a
      DHCP-supplied server list is the obvious candidate) that neither unit
      is configured for.
    x-observed-values:
      - Static
  Endpoints:
    type: array
    items:
      $ref: "#/components/schemas/NTPServerEndpoint"
required:
  - PropertiesType
