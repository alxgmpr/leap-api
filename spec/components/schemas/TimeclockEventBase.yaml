type: object
description: |
  Named field on NLOTime, TimeclockEvent and OccGroupTime whose Go type
  shares the field name (`TimeclockEventBase`). Every observed NLOTime
  instance (Caseta v01.123, via /system/naturallightoptimization) and every
  observed TimeclockEvent (RA3, via /timeclockevent and
  /timeclockevent/{timeclockeventId}) has these fields sitting flat on the
  parent rather than nested under a `TimeclockEventBase` key -- the same
  anonymous-embed promotion class already fixed for ZoneExpandedStatus
  (Task 10), Device/ButtonGroupExpanded/LinkNodeExpanded (Task 12a). See
  NLOTime.yaml and TimeclockEvent.yaml, which flatten this schema via
  `allOf` rather than referencing it as a nested property. OccGroupTime
  leaves it nested -- no fixture has ever populated that type, so there is
  no wire evidence either way (see OccGroupTime.yaml).

  **`AstronomicEventType` is no longer unconditionally required here.**
  Firmware marks it non-pointer, and it held through every capture until
  the coverage-blind spec probe returned `/timeclockevent/6924` (RA3), a
  `TimeclockEventType: "FixedTime"` event that carries `TimeOfDay` and
  neither astronomic field. That is not a firmware/hardware disagreement
  about whether the field exists -- it is this schema being the wrong place
  to state the rule. The astronomic fields are required *when the event is
  astronomic*, and this base type does not carry the discriminator that
  says so: each embedding parent names it differently
  (`TimeclockEvent.TimeclockEventType`,
  `NLOTime.NaturalLightOptimizationEventType`, `OccGroupTime.EventType`,
  all typed `leapobj.EventTimeType`). The dependency is therefore expressed
  as an `if`/`then` in each parent, against that parent's own
  discriminator, rather than relaxed away here -- see those three files.
  Anything embedding this type without such a conditional asserts nothing
  about the astronomic fields, which is the honest position for a parent
  whose discriminator is unknown.
properties:
  AstronomicEventType:
    $ref: "#/components/schemas/AstronomicEventType"
  AstronomicTimeOffset:
    type: string
    description: |
      A signed clock-format offset from the astronomic event, not an ISO
      8601 duration, despite the firmware's `lutcommon.Timespan` type
      (shared with genuine duration fields like
      `DimmedLevelParameters.FadeTime`). Hardware wins outright and the ISO
      8601 alternative is gone, not kept as a fallback: across 10 observed
      values -- 6 TimeclockEvents on RA3 (`"0"` x2 via /timeclockevent/651
      and /676, `"2:00:00"` x2 via /6931 and /6945, `"-2:00:00"` via /6938,
      `"-30:00"` via /10083) and both NLOTime offsets in each of the two
      Caseta v01.123 corpora (`"0"`, via /system/naturallightoptimization)
      -- not one is ISO 8601
      shaped, and the four non-zero ones are all `[-]H:MM:SS` or
      `[-]MM:SS`.

      The earlier version of this schema accepted only the literal `"0"`
      plus the generator's ISO 8601 pattern, and recorded a non-zero
      offset's true wire form as unconfirmed; `/timeclockevent/6931` and
      siblings confirm it. Two independent corroborations of the same
      shape: `Timestamp.Utc` was corrected the same way (`"0"`,
      `"-7:00:00"` -- see Timestamp.yaml), and lib/redact.ts carries a
      negative lookahead carving this exact H:MM:SS / MM:SS shape out of
      its IPv6 pattern, added after 8 `CountdownTimer.Timeout` values (also
      `lutcommon.Timespan`) were wrongly rewritten as IPv6 addresses.

      The offset is genuinely signed -- `"-2:00:00"` and `"-30:00"` are
      sunset/sunrise offsets before the event, and a leading `-` is why
      those two values were never at risk of the redactor's IPv6 pattern in
      the first place.

      Firmware types this field `*lutcommon.Timespan` -- a pointer, i.e.
      optional -- and it is optional here. `TimeclockEvent.yaml`,
      `NLOTime.yaml` and `OccGroupTime.yaml` each require it *conditionally*,
      when their own discriminator says the event is astronomic. That is a
      strengthening beyond what the firmware asserts, taken on 6/6 astronomic
      TimeclockEvents and 4/4 NLOTime instances; see TimeclockEvent.yaml for
      why the same argument does not run for `TimeOfDay`, where n=1.
    pattern: ^(0|-?\d{1,2}(?::[0-5]\d){1,2})$
    example: "-2:00:00"
  TimeOfDay:
    $ref: "#/components/schemas/FixedTime"
