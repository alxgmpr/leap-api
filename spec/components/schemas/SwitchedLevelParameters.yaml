# `SwitchedLevel` points at the shared SwitchedLevel schema on firmware type
# identity (`leapobj.SwitchedLevelParameters.SwitchedLevel` is
# `leapobj.SwitchedLevel`, the same type as ZoneStatus.SwitchedLevel, where
# `On`/`Off` were observed). Command-parameter input, so no corpus observes
# this field itself. See SwitchedLevel.yaml.
type: object
properties:
  SwitchedLevel:
    $ref: "#/components/schemas/SwitchedLevel"
  DelayTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
required:
  - SwitchedLevel
