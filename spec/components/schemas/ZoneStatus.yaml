type: object
description: |
  Firmware marks SwitchedLevel, CCOLevel, ReceptacleLevel, FanSpeed,
  Availability, and ZoneLockState as non-pointer (required), but across the
  138 zone-status bodies the four read corpora return through /zone/status
  and /zone/{zoneId}/status each is only ever present on the zone types it
  applies to (e.g. FanSpeed only on fan zones, SwitchedLevel only on
  switched zones) and most are absent entirely from one platform or the
  other — relaxed to optional here on hardware evidence. StatusAccuracy was
  present on all 138 and stays required.

  `SwitchedLevel` points at the shared `SwitchedLevel` schema (firmware type
  `leapobj.SwitchedLevel`): 22 observations, `Off` 19 and `On` 3, on the
  original Caseta capture and the RA3 v03.249 spec probe. The Caseta spec
  probe reaches one zone and it is dimmed, so it adds none.

  The five enum-typed fields that remain open strings -- CCOLevel,
  ReceptacleLevel, FanSpeed, StatusAccuracy, ZoneLockState -- are open on
  purpose, not for want of looking. Each is a real firmware type whose
  members the extraction failed to recover, and hardware has produced at
  most **two** distinct values for any of them across every corpus: FanSpeed
  has two (`High` and `Off`, the same fan zone at different moments) and the
  other four have one each, ReceptacleLevel none at all. One observed value
  does not distinguish an enum from a constant, and closing on it asserts
  the concept is single-valued: an accuracy that is only ever `Good`, a lock
  state that is only ever `Unlocked`, a CCO that is only ever `Open`. Two
  values from one physical device does not establish the type's vocabulary
  either -- a fan that has been seen off and on high says nothing about
  whether low and medium exist.

  This specification made that assertion five times before, all of them
  predating this pass: `Role` (`Installer`), `SessionRole` (`Admin`),
  `ButtonGroupCategoryType` (`Lights`), `StopIfMovingEnabledState`
  (`Disabled`) and `SystemLoadSheddingState` (`Disabled`). All five are open
  strings now, under the cardinality criterion `OccupancyStatus.yaml`
  records: a one-member closed enum asserts exhaustiveness on a field
  nothing has shown to vary, and none remains in this specification. That is
  not the majority treatment -- 24 closed enum schemas still ship against 6
  documented-open ones -- but it is the whole of the one-member case, and
  these fields are in it for the same reason. `OccupancyStatus` was the
  sixth single-observation closure, and the one where a later probe showed
  what closing costs: it
  shipped closed on `Unknown` alone, its own note said `Occupied` and
  `Unoccupied` were expected but unconfirmed, and the coverage-blind probe
  produced both. That is the precedent this field declines to repeat.
  Values seen to date are recorded per field under `x-observed-values`, as
  documentation rather than as an assertion, and counted per corpus under
  `x-observed-census`.

  **THE CENSUS AND THIS FILE'S PROSE COUNT ON DIFFERENT BASES**, and the
  difference is worth stating once here rather than four times below. The
  prose counts the way `SwitchedLevel.yaml` established: the base routes
  (/zone/status, /zone/{zoneId}/status) on their own, with
  /zone/{zoneId}/status/expanded and
  /area/{areaId}/associatedzone/status[/expanded] called out separately,
  because those routes re-serve zones the base routes already returned and
  folding them in would make a re-derived number look like new evidence.
  `x-observed-census` cannot make that distinction: it is a flat count of
  object occurrences, so `ZoneExpandedStatus` -- which is `allOf` this
  schema -- lands on these same annotated fields and is counted here too, as
  are the frame-log snapshots. Every census total below is therefore larger
  than the prose figure it sits next to, and each field says by how much.
  Neither number is wrong; they answer different questions.

  `Availability` points at the shared `Availability` schema: its firmware
  type is `leapobj.Availability`, the same type as DeviceStatus.Availability,
  where 87 observations produced `Available`/`Unknown`. No read corpus ever
  populates it on a zone, on either platform. All 8 zone-side observations
  are `Available`, and every one is a `CreateResponse` reply to a
  `/zone/{id}/commandprocessor` write -- 2 in `fixtures/push-probe.json` and
  6 in `fixtures/push-experiments.json` (2 each in `ra3-push-pad-0`,
  `ra3-push-pad-7` and `caseta-push-pad-0`, the last being the first Caseta
  zone-side observations in the project). See `Availability.yaml`.
properties:
  href:
    type: string
  Level:
    type: number
  Vibrancy:
    type: number
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
  Tilt:
    type: number
  SwitchedLevel:
    $ref: "#/components/schemas/SwitchedLevel"
  CCOLevel:
    type: string
    description: |
      TODO(enum): members of CCOLevel were not recovered from the firmware
      extraction, and hardware has produced exactly one: `Open`, 3
      observations across the two RA3 corpora (/zone/status and
      /zone/2520/status, the only CCO zone either reaches; no Caseta
      corpus reaches one). `x-observed-census` totals 9 on the flat basis
      this schema's description explains: those 3, plus 1 through
      /zone/2520/status/expanded and 5 in the RA3 frame logs -- all of them
      that same zone. A `Closed` counterpart is
      all but certain and simply never coincided with a probe, which is
      why this stays an open string.
    x-observed-values:
      - Open
    x-observed-census:
      Open:
        fixtures/push-experiments.json: 4
        fixtures/push-probe.json: 1
        ra3: 3
        spec-read-ra3: 1
  ReceptacleLevel:
    type: string
    description: |
      TODO(enum): members of ReceptacleLevel were not recovered from the
      firmware extraction, and hardware has produced nothing either: no
      probed zone on either platform is a receptacle zone, so no corpus
      carries this field at all.
  FanSpeed:
    type: string
    description: |
      TODO(enum): members of FanSpeed were not recovered from the firmware
      extraction, and hardware has produced two, both from
      /zone/1982/status -- the single observed fan zone, on the RA3 side. No
      Caseta corpus reaches a fan zone and no Caseta frame log carries the
      field, but for two different reasons: the two Caseta corpora that reach
      zones at all reach 14 and 1 respectively and none is a fan zone, while
      the bare-bridge corpus reaches none, answering /zone/status
      `204 NoContent` and 404ing all 8 per-zone ids. `caseta-push-pad-0`, the
      one Caseta frame-log run that carries zone statuses, carries no
      `FanSpeed` either.

      `High`, 6 observations: 3 in the read corpora (`fixtures/ra3.json`
      via /zone/status and /zone/1982/status, `fixtures/spec-read.json` via
      /zone/status) and 3 more in subscribe-time snapshots
      (`fixtures/push-probe.json`, and `ra3-push-pad-0` and `ra3-push-pad-7`
      in `fixtures/push-experiments.json`). One further `High` comes through
      /zone/1982/status/expanded and is counted separately as
      ZoneExpandedStatus, the same convention `SwitchedLevel.yaml` uses.

      `Off`, 1 observation: the /zone/status subscribe snapshot of
      `ra3-keypad-press` in `fixtures/push-experiments.json`. The fixture
      stores that snapshot twice -- once as `frames[0]` and once as
      `subscriptions[0].body` -- so it is two sites and one observation.

      Every one of those seven observations is a **snapshot or a read**, as
      is the eighth counted separately through the expanded route; no push in
      any capture carries a `FanSpeed` at all, since pushes are field-level
      deltas and no fan changed while a capture was open. See
      `docs/subscriptions.md`.

      `x-observed-census` totals 9, exactly one more than those eight. The
      expanded-route `High` is already the eighth of them, so it is not the
      difference; the ninth is the `ra3-keypad-press` snapshot, which the
      census counts twice because it counts occurrences and not observations.
      Per value: `High` 7 -- the 6 above plus the expanded one, which the
      census cannot hold apart; `Off` 2 -- the single observation, stored
      twice. This field is the clearest case in the file of why the two bases
      are kept apart.

      Two values on one physical fan at two different moments is a lower
      bound, not the vocabulary of the type: low and medium counterparts
      are expected and unobserved, which is why this stays an open string.
    x-observed-values:
      - High
      - "Off"
    x-observed-census:
      High:
        fixtures/push-experiments.json: 2
        fixtures/push-probe.json: 1
        ra3: 3
        spec-read-ra3: 1
      "Off":
        fixtures/push-experiments.json: 2
  Zone:
    $ref: "#/components/schemas/HyperReference"
  StatusAccuracy:
    type: string
    description: |
      TODO(enum): members of StatusAccuracy were not recovered from the
      firmware extraction, and hardware has produced exactly one: `Good`,
      138 observations across both platforms and all four read corpora that
      return a zone status (/zone/status and /zone/{zoneId}/status), plus 50
      more through ZoneExpandedStatus, 36 through
      /area/{areaId}/associatedzone/status and its expanded form (18 zones
      each; both routes gained a declared response schema in the area-misc
      family, so conformance now validates those 36 too), and 52 more in
      `fixtures/push-probe.json`. Only 2 of those 52 are in pushes (`seq` 21
      and 25): 46 are in the subscribe-time snapshot (`seq` 18), 2 in the
      CreateResponse command replies (`seq` 20, 24) and 2 in ordinary reads
      (`seq` 2, 27). `x-observed-census` totals 510 -- those 224 probe-set
      occurrences, the 52, and 234 more in `fixtures/push-experiments.json`,
      which this paragraph had never counted. Volume is
      not variety -- every probe caught a healthy system, and a field named
      "status accuracy" exists to report the unhealthy case this corpus
      never provoked.
    x-observed-values:
      - Good
    x-observed-census:
      Good:
        caseta: 42
        fixtures/push-experiments.json: 234
        fixtures/push-probe.json: 52
        ra3: 81
        spec-read-caseta: 3
        spec-read-ra3: 98
  Availability:
    $ref: "#/components/schemas/Availability"
  SingleSetPointHVACStatus:
    $ref: "#/components/schemas/SingleSetPointHVACStatus"
  DualSetPointHVACStatus:
    $ref: "#/components/schemas/DualSetPointHVACStatus"
  ZoneLockState:
    type: string
    description: |
      TODO(enum): members of ZoneLockState were not recovered from the
      firmware extraction, and hardware has produced exactly one:
      `Unlocked`, 102 observations across the two RA3 corpora (the field
      never appears on any of the three Caseta corpora), plus 33 through
      ZoneExpandedStatus and 36 through
      /area/{areaId}/associatedzone/status and its expanded form.
      `x-observed-census` totals 397 -- those 171 probe-set occurrences plus
      226 in the two RA3 frame logs, which this paragraph had never counted.
      A `Locked`
      counterpart is implied by the field's own name; no probed zone was
      locked.
    x-observed-values:
      - Unlocked
    x-observed-census:
      Unlocked:
        fixtures/push-experiments.json: 180
        fixtures/push-probe.json: 46
        ra3: 75
        spec-read-ra3: 96
required:
  - StatusAccuracy
