type: object
description: |
  Firmware marks SwitchedLevel, CCOLevel, ReceptacleLevel, FanSpeed,
  Availability, and ZoneLockState as non-pointer (required), but across 41
  observed zones (RA3 v03.247, Caseta v01.123) each is only ever present on
  the zone types it applies to (e.g. FanSpeed only on fan zones, SwitchedLevel
  only on switched zones) and most are absent entirely from one platform or
  the other — relaxed to optional here on hardware evidence. StatusAccuracy
  was present on all 41 and stays required.

  `SwitchedLevel` points at the shared `SwitchedLevel` schema (firmware type
  `leapobj.SwitchedLevel`): 22 observations, `Off` 19 and `On` 3, on Caseta
  and RA3 unit 2.

  The five enum-typed fields that remain open strings -- CCOLevel,
  ReceptacleLevel, FanSpeed, StatusAccuracy, ZoneLockState -- are open on
  purpose, not for want of looking. Each is a real firmware type whose
  members the extraction failed to recover, and hardware has produced at
  most one value for each across every corpus. One observed value does not
  distinguish an enum from a constant, and closing on it asserts the concept
  is single-valued: an accuracy that is only ever `Good`, a lock state that
  is only ever `Unlocked`, a CCO that is only ever `Open`. That assertion
  was made once in this specification, for OccupancyStatus, and the next
  probe falsified it. Values seen to date are recorded per field under
  `x-observed-values`, as documentation rather than as an assertion.

  `Availability` points at the shared `Availability` schema: its firmware
  type is `leapobj.Availability`, the same type as DeviceStatus.Availability,
  where 85 observations produced `Available`/`Unknown`. No read corpus ever
  populates it on a zone; the two zone-side observations are the `Available`
  values in `fixtures/push-probe.json`'s CreateResponse frames for a live
  level change on /zone/4664.
properties:
  href:
    type: string
  Level:
    type: number
  Vibrancy:
    type: number
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
  Tilt:
    type: number
  SwitchedLevel:
    $ref: "#/components/schemas/SwitchedLevel"
  CCOLevel:
    type: string
    description: |
      TODO(enum): members of CCOLevel were not recovered from the firmware
      extraction, and hardware has produced exactly one: `Open`, 3
      observations on the RA3 units (/zone/status and /zone/2520/status,
      the only CCO zone either capture reaches). A `Closed` counterpart is
      all but certain and simply never coincided with a probe, which is
      why this stays an open string.
    x-observed-values:
      - Open
  ReceptacleLevel:
    type: string
    description: |
      TODO(enum): members of ReceptacleLevel were not recovered from the
      firmware extraction, and hardware has produced nothing either: no
      probed zone on either platform is a receptacle zone, so no corpus
      carries this field at all.
  FanSpeed:
    type: string
    description: |
      TODO(enum): members of FanSpeed were not recovered from the firmware
      extraction, and hardware has produced exactly one: `High`, 3
      observations on the RA3 units (/zone/status and /zone/1982/status,
      the single observed fan zone). One fan at one moment is not the
      vocabulary of the type; off/low/medium counterparts are expected.
    x-observed-values:
      - High
  Zone:
    $ref: "#/components/schemas/HyperReference"
  StatusAccuracy:
    type: string
    description: |
      TODO(enum): members of StatusAccuracy were not recovered from the
      firmware extraction, and hardware has produced exactly one: `Good`,
      136 observations across both platforms and all read corpora, plus 49
      more through ZoneExpandedStatus and 52 in pushed frames. Volume is
      not variety -- every probe caught a healthy system, and a field named
      "status accuracy" exists to report the unhealthy case this corpus
      never provoked.
    x-observed-values:
      - Good
  Availability:
    $ref: "#/components/schemas/Availability"
  SingleSetPointHVACStatus:
    $ref: "#/components/schemas/SingleSetPointHVACStatus"
  DualSetPointHVACStatus:
    $ref: "#/components/schemas/DualSetPointHVACStatus"
  ZoneLockState:
    type: string
    description: |
      TODO(enum): members of ZoneLockState were not recovered from the
      firmware extraction, and hardware has produced exactly one:
      `Unlocked`, 102 observations on the RA3 units (the field never
      appears on Caseta), plus 33 through ZoneExpandedStatus. A `Locked`
      counterpart is implied by the field's own name; no probed zone was
      locked.
    x-observed-values:
      - Unlocked
required:
  - StatusAccuracy
