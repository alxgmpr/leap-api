type: object
description: |
  Firmware marks SwitchedLevel, CCOLevel, ReceptacleLevel, FanSpeed,
  Availability, and ZoneLockState as non-pointer (required), but across the
  138 zone-status bodies the four read corpora return through /zone/status
  and /zone/{zoneId}/status each is only ever present on the zone types it
  applies to (e.g. FanSpeed only on fan zones, SwitchedLevel only on
  switched zones) and most are absent entirely from one platform or the
  other — relaxed to optional here on hardware evidence. StatusAccuracy was
  present on all 138 and stays required.

  `SwitchedLevel` points at the shared `SwitchedLevel` schema (firmware type
  `leapobj.SwitchedLevel`): 22 observations, `Off` 19 and `On` 3, on the
  original Caseta capture and the RA3 v03.249 spec probe. The Caseta spec
  probe reaches one zone and it is dimmed, so it adds none.

  Three of these enum-typed fields -- CCOLevel, ReceptacleLevel and FanSpeed
  -- now point at shared closed schemas, and closed on **firmware** evidence
  rather than wire observation. Hardware had produced at most two distinct
  values for any of them (FanSpeed `High`/`Off` on one fan zone, CCOLevel
  `Open`, ReceptacleLevel none), which is no basis to close an enum -- one or
  two observations do not distinguish an enum from a constant. What closed
  them is the member list the struct extraction never recovered: the RA3
  `leap-server` binary's own functions that consume each value are exhaustive
  `switch`es with a default-error branch, so disassembling them yields the
  firmware's complete set (the extraction recovers Go `struct` definitions
  only and drops a `type X string`'s consts, which is why these shipped as
  bare open strings). See `CCOLevel.yaml`, `ReceptacleLevel.yaml` and
  `FanSpeed.yaml`; each observed value is a member of its recovered set.

  ZoneLockState now points at a shared closed schema too, but on a different
  source: its values are not produced anywhere in `leap-server` (which
  forwards the field from another RA3 daemon rather than computing it, so it
  is absent from every RA3 binary), and hardware has only ever shown
  `Unlocked`. The Lutron app decompile supplies the set the firmware
  withheld -- `Unlocked`, `NonEmergencyLocked`, `EmergencyLocked` -- the same
  app-RE source that populated `CommandType`. See `ZoneLockState.yaml`.

  StatusAccuracy stays an open string. Neither the firmware recovery nor the
  app decompile produced its set, and hardware has shown one value (`Good`).
  Closing on a single observation asserts the concept is single-valued: an
  accuracy that is only ever `Good`. This specification made that assertion
  five times before, all predating this pass: `Role` (`Installer`),
  `SessionRole` (`Admin`), `ButtonGroupCategoryType` (`Lights`),
  `StopIfMovingEnabledState` (`Disabled`) and `SystemLoadSheddingState`
  (`Disabled`), all open strings now, under the criterion
  `OccupancyStatus.yaml` records: a closed enum needs evidence about the
  extent of its set, and a one-member enum with no member list from anywhere
  else has none. `OccupancyStatus` was the case where a later probe showed
  what closing costs -- it shipped closed on `Unknown` alone, its note said
  `Occupied` and `Unoccupied` were expected but unconfirmed, and the
  coverage-blind probe produced both. That is the precedent StatusAccuracy
  declines to repeat. Values seen to date are recorded per field under
  `x-observed-values`, as documentation rather than as an assertion, and
  counted per corpus under `x-observed-census`.

  **THE CENSUS AND THIS FILE'S PROSE COUNT ON DIFFERENT BASES**, and the
  difference is worth stating once here rather than four times below. The
  prose counts the way `SwitchedLevel.yaml` established: the base routes
  (/zone/status, /zone/{zoneId}/status) on their own, with
  /zone/{zoneId}/status/expanded and
  /area/{areaId}/associatedzone/status[/expanded] called out separately,
  because those routes re-serve zones the base routes already returned and
  folding them in would make a re-derived number look like new evidence.
  `x-observed-census` cannot make that distinction: it is a flat count of
  object occurrences, so `ZoneExpandedStatus` -- which is `allOf` this
  schema -- lands on these same annotated fields and is counted here too, as
  are the frame-log snapshots. Every census total below is therefore larger
  than the prose figure it sits next to, and each field says by how much.
  Neither number is wrong; they answer different questions.

  `Availability` points at the shared `Availability` schema: its firmware
  type is `leapobj.Availability`, the same type as DeviceStatus.Availability,
  where 87 observations produced `Available`/`Unknown`. No read corpus ever
  populates it on a zone, on either platform. All 8 zone-side observations
  are `Available`, and every one is a `CreateResponse` reply to a
  `/zone/{id}/commandprocessor` write -- 2 in `fixtures/push-probe.json` and
  6 in `fixtures/push-experiments.json` (2 each in `ra3-push-pad-0`,
  `ra3-push-pad-7` and `caseta-push-pad-0`, the last being the first Caseta
  zone-side observations in the project). See `Availability.yaml`.
properties:
  href:
    type: string
  Level:
    type: number
  Vibrancy:
    type: number
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
  Tilt:
    type: number
  SwitchedLevel:
    $ref: "#/components/schemas/SwitchedLevel"
  CCOLevel:
    $ref: "#/components/schemas/CCOLevel"
  ReceptacleLevel:
    $ref: "#/components/schemas/ReceptacleLevel"
  FanSpeed:
    $ref: "#/components/schemas/FanSpeed"
  Zone:
    $ref: "#/components/schemas/HyperReference"
  StatusAccuracy:
    type: string
    description: |
      TODO(enum): members of StatusAccuracy were not recovered from the
      firmware extraction, and hardware has produced exactly one: `Good`,
      138 observations across both platforms and all four read corpora that
      return a zone status (/zone/status and /zone/{zoneId}/status), plus 50
      more through ZoneExpandedStatus, 36 through
      /area/{areaId}/associatedzone/status and its expanded form (18 zones
      each; both routes gained a declared response schema in the area-misc
      family, so conformance now validates those 36 too), and 52 more in
      `fixtures/push-probe.json`. Only 2 of those 52 are in pushes (`seq` 21
      and 25): 46 are in the subscribe-time snapshot (`seq` 18), 2 in the
      CreateResponse command replies (`seq` 20, 24) and 2 in ordinary reads
      (`seq` 2, 27). `x-observed-census` totals 510 -- those 224 probe-set
      occurrences, the 52, and 234 more in `fixtures/push-experiments.json`,
      which this paragraph had never counted. Volume is
      not variety -- every probe caught a healthy system, and a field named
      "status accuracy" exists to report the unhealthy case this corpus
      never provoked.
    x-observed-values:
      - Good
    x-observed-census:
      Good:
        caseta: 42
        fixtures/push-experiments.json: 234
        fixtures/push-probe.json: 52
        ra3: 81
        spec-read-caseta: 3
        spec-read-ra3: 98
  Availability:
    $ref: "#/components/schemas/Availability"
  SingleSetPointHVACStatus:
    $ref: "#/components/schemas/SingleSetPointHVACStatus"
  DualSetPointHVACStatus:
    $ref: "#/components/schemas/DualSetPointHVACStatus"
  ZoneLockState:
    $ref: "#/components/schemas/ZoneLockState"
required:
  - StatusAccuracy
