type: object
description: |
  Firmware marks SwitchedLevel, CCOLevel, ReceptacleLevel, FanSpeed,
  Availability, and ZoneLockState as non-pointer (required), but across 41
  observed zones (RA3 v03.247, Caseta v01.123) each is only ever present on
  the zone types it applies to (e.g. FanSpeed only on fan zones, SwitchedLevel
  only on switched zones) and most are absent entirely from one platform or
  the other — relaxed to optional here on hardware evidence. StatusAccuracy
  was present on all 41 and stays required.

  `SwitchedLevel` points at the shared `SwitchedLevel` schema (firmware type
  `leapobj.SwitchedLevel`): 22 observations, `Off` 19 and `On` 3, on Caseta
  and RA3 unit 2.

  `Availability` points at the shared `Availability` schema: its firmware
  type is `leapobj.Availability`, the same type as DeviceStatus.Availability,
  where 85 observations produced `Available`/`Unknown`. No read corpus ever
  populates it on a zone; the two zone-side observations are the `Available`
  values in `fixtures/push-probe.json`'s CreateResponse frames for a live
  level change on /zone/4664.
properties:
  href:
    type: string
  Level:
    type: number
  Vibrancy:
    type: number
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
  Tilt:
    type: number
  SwitchedLevel:
    $ref: "#/components/schemas/SwitchedLevel"
  CCOLevel:
    type: string
    description: "TODO(enum): members of CCOLevel were not recovered from the
      firmware extraction"
  ReceptacleLevel:
    type: string
    description: "TODO(enum): members of ReceptacleLevel were not recovered from the
      firmware extraction"
  FanSpeed:
    type: string
    description: "TODO(enum): members of FanSpeed were not recovered from the
      firmware extraction"
  Zone:
    $ref: "#/components/schemas/HyperReference"
  StatusAccuracy:
    type: string
    description: "TODO(enum): members of StatusAccuracy were not recovered from the
      firmware extraction"
  Availability:
    $ref: "#/components/schemas/Availability"
  SingleSetPointHVACStatus:
    $ref: "#/components/schemas/SingleSetPointHVACStatus"
  DualSetPointHVACStatus:
    $ref: "#/components/schemas/DualSetPointHVACStatus"
  ZoneLockState:
    type: string
    description: "TODO(enum): members of ZoneLockState were not recovered from the
      firmware extraction"
required:
  - StatusAccuracy
