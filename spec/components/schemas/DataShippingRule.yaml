# `EnabledState` points at the shared EnabledState schema on firmware type
# identity (`leapobj.DataShippingRule.EnabledState` is `leapobj.EnabledState`).
# /datashipping* is never probed with a 200 in any corpus, so this field has
# zero direct coverage; the members come from the shared type -- see
# EnabledState.yaml.
type: object
properties:
  href:
    type: string
  RuleName:
    type: string
  EnabledState:
    $ref: "#/components/schemas/EnabledState"
required:
  - RuleName
  - EnabledState
