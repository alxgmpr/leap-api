# `required` trimmed: firmware marks StopIfMoving non-pointer, but it's
# absent on all 16 observed button groups from the device family's expanded
# button-group route (see ButtonGroupExpanded.yaml). The buttongroup family's
# own /buttongroup route adds 51 more observed button groups (both
# platforms): StopIfMoving is populated on 19/51 of those (Caseta only,
# always "Disabled" -- see StopIfMovingEnabledState.yaml) but still absent
# on the rest, so the relaxation still holds. href, SortOrder, and
# ProgrammingType (51/51 each, across both routes) stay required.
type: object
properties:
  href:
    type: string
  Buttons:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  AffectedZones:
    type: array
    items:
      $ref: "#/components/schemas/AffectedZoneSummary"
  Parent:
    $ref: "#/components/schemas/HyperReference"
  SortOrder:
    type: integer
    minimum: 0
    maximum: 4294967295
  StopIfMoving:
    $ref: "#/components/schemas/StopIfMovingEnabledState"
  Category:
    $ref: "#/components/schemas/ButtonGroupCategory"
  ProgrammingType:
    $ref: "#/components/schemas/ProgrammingType"
required:
  - href
  - SortOrder
  - ProgrammingType
