type: object
properties:
  Level:
    type: number
  CurveDimming:
    $ref: "#/components/schemas/CurveDimming"
  DelayTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  FadeTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  IgnoreLevelAndTurnOn:
    type: boolean
