# HAND-AUTHORED. Shipped as a closed one-member `enum` until this pass --
# see the description for why it is an open string now.
type: string
description: |
  Load shedding activation state, from `SystemLoadSheddingStatus.State`
  (firmware type `leapobj.SystemLoadSheddingState`) via
  /system/loadshedding/status.

  **Open string, not an enum.** This shipped as a closed **one-member**
  `enum`, and one member is the case where the `enum` adds nothing:
  `enum: [Disabled]` and `x-observed-values: [Disabled]` assert the same
  *content*. The only thing the `enum` adds is "and nothing else, ever" --
  an exhaustiveness claim on a sample that has never once shown this field
  to vary. Opening drops that and loses no evidenced content, and it moves
  the claim somewhere machine-checked in both directions
  (`test/observed-values.test.ts`), which the `enum` never was for
  frame-log bodies.

  **That is not a general licence to reopen**, and the limit is stated here
  so this file does not read as one. 24 closed enums still ship in this
  specification, every one beside a note of its own saying the member list
  is not exhaustive, and they stay closed because something evidences the
  extent of their set: 23 have every declared member independently observed
  in the fixtures, and `CommandType` has a documented non-wire source for
  its 39 (decompiled Lutron app binaries), of which only `PressAndRelease`
  has ever been observed **as a `CommandType`**. (`Raise` and `Lower` do
  appear on the wire, but as the two members of `RaiseLowerDirection`,
  under `Direction` -- a different enum that happens to share those two
  names.)

  **Neither ground claims the set is complete.** Every closed enum here is a
  lower bound, and a later corpus can still falsify one. Three already have,
  all from the strong end of the first ground: `ServiceType` had all 8 of
  its declared members independently observed and a ninth arrived on a later
  probe; `ServerType` had both of its 2 observed and a third arrived from a
  second platform; `ProgrammingModelType` had all 5 observed and a sixth
  arrived on a later RA3 build. One was reopened and two were extended, on
  the split `OccupancyStatus.yaml` sets out. What this field had was neither
  ground at all -- one observed value, and no member list from anywhere else
  -- which makes it the **weakest case on the same scale**, not a different
  kind of case. Firmware typing does not decide *this* question -- it
  decides only whether an already-falsified set reopens or is extended, and
  nothing here has been falsified. This field is typed
  `leapobj.SystemLoadSheddingState`, a named type the extraction never
  defined, and so is every one of those 24, so typing cannot separate them.
  See `OccupancyStatus.yaml`, which records the criterion in full and the
  ruling it reverses.

  This is the thinnest evidence of the five. `Disabled` is observed twice,
  once in each RA3 corpus (v03.247 and v03.249) and counted per corpus under
  `x-observed-census` -- two observations of the same value on the same
  installation, which is one installation's configuration, not a vocabulary.
  Unconfirmed on Caseta: all three Caseta corpora answer this route
  `405 MethodNotAllowed`. An `Enabled` counterpart is what the concept
  implies and no fixture carries.
x-observed-values:
  - Disabled
x-observed-census:
  Disabled:
    ra3: 1
    spec-read-ra3: 1
