type: string
description: |
  Load shedding activation state. The firmware extraction did not recover
  the full enum; the member below was recovered from
  SystemLoadSheddingStatus.State via /system/loadshedding/status, observed
  once in each RA3 corpus (v03.247 and v03.249) and unconfirmed on Caseta,
  which returns 405 MethodNotAllowed on this route. Two observations of the
  same value on one installation; unlisted values are possible.
enum:
