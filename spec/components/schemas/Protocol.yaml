type: string
description: |
  Transport protocol for a server Endpoint. The firmware extraction did not
  recover the full enum; members below were recovered from Endpoint.Protocol
  observed on RA3 v03.247 (`TCP`, `UDP` on the LEAP server; `TLS`, `WSS` on
  the IPL server) and Caseta v01.123 (`TCP`), via /server. Unlisted values
  are possible.
enum:
  - TCP
  - UDP
  - TLS
  - WSS
