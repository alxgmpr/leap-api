type: string
description: |
  Kind of programming model attached to a button, virtual button, or
  occupancy group. The firmware extraction did not recover the full enum;
  members below were recovered from ProgrammingModel.ProgrammingModelType
  observed on RA3 v03.247 (`AdvancedToggleProgrammingModel`,
  `SingleActionProgrammingModel`, `SingleSceneLowerProgrammingModel`,
  `SingleSceneRaiseProgrammingModel`) and Caseta v01.123
  (`SingleActionProgrammingModel`, `SingleSceneLowerProgrammingModel`,
  `SingleSceneRaiseProgrammingModel`, `DualActionProgrammingModel`), via
  /programmingmodel and /device/{deviceId}/buttongroup/expanded. Unlisted
  values are possible.

  `SimpleConditionalProgrammingModel` is the sixth member, and it is the
  first one this enum learned by being falsified rather than by being
  extended before the fact: the coverage-blind spec probe (RA3 v03.249)
  returned it on two distinct buttons -- `/button/498` (fetched directly,
  and again inside `/buttongroup/493/button`; the same body also appears in
  the sweep-write corpus) and `/button/1568` (inside
  `/buttongroup/1609/button`) -- 3 occurrences out of 43
  `ProgrammingModelType` values in that corpus.

  It appears in neither the original RA3 capture nor either Caseta corpus,
  and those two absences have different explanations:

  - **RA3 v03.247: a coverage artifact.** That capture never reached a
    per-button route at all -- its `/button` collection returns a bare
    `{}`, and it probed no `/button/{buttonId}` -- so it had no opportunity
    to see this value. The only routes that carry it are per-button ones,
    and the corpora that exercised them (the v03.249 spec probe and
    `sweep-write`) both found it. Note the two RA3 corpora report the same
    project at different firmware builds, so "a differently programmed
    installation" is not an available explanation here either way.
  - **Caseta v01.123: an unexplained platform gap.** Caseta's coverage is
    not the problem: `/programmingmodel` is a fully enumerated collection
    on both Caseta corpora (178 entries on the original capture, 109 on the
    spec probe), and across 295 `ProgrammingModelType` observations neither
    returns this member. The Caseta spec probe also asked 8
    `/button/{buttonId}` routes and got `404 NotFound` on all 8. Whether
    Caseta's firmware lacks the concept or simply has none configured is
    not established here.

  Neither absence bears on the enum: adding a member to a closed set
  asserts nothing about which platform emits it.

  This is a real firmware enum whose members the extraction failed to
  recover, so it stays closed here and grows as observation forces it --
  taking the observed set as a lower bound, exactly as the paragraph above
  says. A seventh member turning up in a future capture is expected, and
  should be added the same way rather than treated as a reason to open the
  field.
enum:
  - AdvancedToggleProgrammingModel
  - SingleActionProgrammingModel
  - SingleSceneLowerProgrammingModel
  - SingleSceneRaiseProgrammingModel
  - DualActionProgrammingModel
  - SimpleConditionalProgrammingModel
