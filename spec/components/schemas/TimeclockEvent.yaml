# Refined from _generated/TimeclockEvent.yaml. Three deviations, all decided
# from fixture evidence. Counts below are of *distinct* TimeclockEvent
# objects, not of bodies: the original RA3 capture (v03.247) returned 2
# (/timeclockevent/651 and /676, via /timeclockevent), and the coverage-blind
# spec probe (v03.249) returned 7 -- those same two, byte-identical, plus 5
# from its 3 timeclocks, each fetched both as a collection and individually
# via /timeclockevent/{timeclockeventId}. Hand-authored; see
# timeclockevent.yaml and timeclock.yaml:
#
# 1. FLATTENED `TimeclockEventBase` and `WeeklyRecurrence`, both named
#    fields whose Go type shares the field name -- anonymous embeds, same
#    class of bug as ZoneExpandedStatus (Task 10), Device/ButtonGroupExpanded/
#    LinkNodeExpanded (Task 12a), and NLOTime (Task 12b, which flattened
#    this same TimeclockEventBase type for a different parent schema). All 7
#    distinct TimeclockEvent objects have TimeclockEventBase's fields
#    (AstronomicEventType, AstronomicTimeOffset, TimeOfDay) and
#    WeeklyRecurrence's fields (Sunday..Saturday) sitting flat at the top
#    level, never nested under a "TimeclockEventBase" or "WeeklyRecurrence"
#    key. Restructured as `allOf` against both.
#
# 2. `required` trimmed: firmware marks GlobalID, Dates,
#    AnnuallyReoccurringDates, ExceptionDates, and
#    AnnuallyReoccurringExceptionDates non-pointer, but none are present on
#    any observed instance (0/7 each) -- relaxed to optional. Name,
#    ScheduleType, TimeclockEventType (7/7 each) stay required.
#
# 3. The astronomic fields' dependency on TimeclockEventType is expressed
#    as an `if`/`then`, not relaxed away -- recorded in the schema-level
#    `description` below rather than here, because it is a rule a reader of
#    the rendered document needs, not just a maintenance note.
#
# `ScheduleType` and `TimeclockEventType` point at shared enum schemas
# (ScheduleType.yaml, EventTimeType.yaml) recovered from this and other
# tasks' fixture evidence -- see those files' descriptions.
type: object
description: |
  `TimeclockEventType` discriminates which timing fields the event carries,
  and the specification states that as a conditional rather than as a flat
  `required` list.

  `TimeclockEventBase` marks `AstronomicEventType` non-pointer, so the
  generated schema required it on every TimeclockEvent. The coverage-blind
  spec probe falsified that with `/timeclockevent/6924` (RA3): a
  `TimeclockEventType: "FixedTime"` event carrying `TimeOfDay: {"Hour": 7,
  "Minute": 0}` and neither astronomic field. Its absence there is correct,
  not a firmware/hardware disagreement about the field -- an event anchored
  to a wall-clock time has no sunrise/sunset anchor to report.

  So rather than relax `required` and assert nothing, the real constraint
  is expressed with OpenAPI 3.1's `if`/`then` (3.1 schemas are JSON Schema
  2020-12, so the applicator keywords are available): when
  `TimeclockEventType` is `Astronomic`, both `AstronomicEventType` and
  `AstronomicTimeOffset` are required. That holds on 6/6 observed
  astronomic events -- `/timeclockevent/{651,676}`, returned identically by
  both RA3 corpora, and `/timeclockevent/{6931,6938,6945,10083}`, which only
  the v03.249 spec probe reaches -- and is
  vacuously satisfied by the one observed `FixedTime` event. The `if`
  itself requires `TimeclockEventType`, so an event that somehow omitted
  the discriminator is not silently held to the astronomic rule; the
  top-level `required` already rejects that case.

  **The `then` clause asserts more than the firmware does, deliberately.**
  Firmware types `AstronomicEventType` non-pointer but
  `AstronomicTimeOffset` a *pointer*:

      type leapobj.TimeclockEventBase struct {
          AstronomicEventType leapobj.AstronomicEventType
          AstronomicTimeOffset *lutcommon.Timespan
          TimeOfDay  *leapobj.FixedTime
      }

  Before this conditional, `AstronomicTimeOffset` was required nowhere in
  the specification. So requiring it on astronomic events is a restatement
  of the firmware's `AstronomicEventType` rule *plus* a strengthening the
  firmware does not back. The strengthening rests on 6/6: every astronomic
  TimeclockEvent in either RA3 corpus carries the offset, and so do all 4
  NLOTime instances across the two Caseta corpora.

  No converse rule is asserted for `FixedTime`, and the difference is the
  sample size, not the direction of the rule. `TimeOfDay` was present on the
  single observed `FixedTime` event, but firmware types it
  `*leapobj.FixedTime` (a pointer, i.e. optional) and n=1 is not a base to
  contradict a pointer -- firmware and hardware agree it is optional, so it
  stays optional. 6/6 is; n=1 is not.
allOf:
  - $ref: "#/components/schemas/TimeclockEventBase"
  - $ref: "#/components/schemas/WeeklyRecurrence"
if:
  properties:
    TimeclockEventType:
      const: Astronomic
  required:
    - TimeclockEventType
then:
  required:
    - AstronomicEventType
    - AstronomicTimeOffset
properties:
  href:
    type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  ProgrammingModel:
    $ref: "#/components/schemas/HyperReference"
  Name:
    type: string
  GlobalID:
    type: string
  ScheduleType:
    $ref: "#/components/schemas/ScheduleType"
  Dates:
    type: string
    description: "TODO(enum): members of DateList were not recovered from the
      firmware extraction"
  AnnuallyReoccurringDates:
    type: string
    description: "TODO(enum): members of DateList were not recovered from the
      firmware extraction"
  BeginDate:
    $ref: "#/components/schemas/Date"
  EndDate:
    $ref: "#/components/schemas/Date"
  ExceptionDates:
    type: string
    description: "TODO(enum): members of DateList were not recovered from the
      firmware extraction"
  AnnuallyReoccurringExceptionDates:
    type: string
    description: "TODO(enum): members of DateList were not recovered from the
      firmware extraction"
  TimeclockEventType:
    $ref: "#/components/schemas/EventTimeType"
required:
  - Name
  - ScheduleType
  - TimeclockEventType
