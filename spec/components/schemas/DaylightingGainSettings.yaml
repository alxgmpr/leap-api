# Refined from _generated/DaylightingGainSettings.yaml. Two deviations:
#
# 1. `ImmediateLevelChangeUnsupported` relaxed to optional. Firmware marks it
#    non-pointer (`ImmediateLevelChangeUnsupported bool`), so the generated
#    schema required it; the one observed instance omits it. Same direction
#    of inference Organization.yaml and LoadController.yaml record -- an
#    observed absence falsifies a non-pointer `required`, while presence on a
#    small sample is not evidence for one. `EnabledState` (also non-pointer)
#    is present and stays required.
#
# 2. `EnabledState` points at the shared EnabledState schema rather than the
#    generated inline open string. Firmware types the field
#    `EnabledState leapobj.EnabledState` -- the same named type, and the same
#    type-identity basis EnabledState.yaml records for its other users; the
#    one observed value, `Enabled`, is a member.
type: object
description: |
  Daylighting gain configuration. Every observed instance is an area's; the
  zone-level routes (`/zone/daylightinggainsettings` and its per-zone form)
  exist in the specification but have never returned a body, and
  `Zone.DaylightingGainSettings` is a bare `HyperReference`, so nothing in
  this project's evidence says what a zone's looks like.

  **The whole evidence base for this schema is one object.** Only the two
  coverage-blind spec probes ever requested any `/area/*daylightinggainsettings`
  URL, 9 requests each -- the collection route plus 8 area ids. Two of
  Caseta v01.123's 9 returned a `DaylightingGainSettings` payload
  (`fixtures/spec-read-caseta.json`); the other seven are `404 NotFound`,
  which carry a `{"Message": ...}` body of their own and so are not
  body-less, only payload-less. The two carry the same object:
  `/area/2/daylightinggainsettings`, and the
  `/area/daylightinggainsettings` collection whose sole element is
  byte-identical to it. **Two bodies, one object** -- seen through two
  routes, not two observations of two objects. RA3 v03.249 answers the
  collection route `204 NoContent` and all 8 per-area requests `404 NotFound`
  (`fixtures/spec-read.json`); the original RA3 and Caseta campaign corpora
  and the sweep corpora never requested these URLs at all.

  `TargetSetPoint` (`33.33`) and `MinimumDaylightLevelSettings`
  (`{"LevelType": "Off"}`) are both pointers in firmware and both present on
  that object; `Follows` is a pointer and absent. None of that is a
  disagreement, so nothing but the `required` list above changed.
properties:
  href:
    type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  Follows:
    $ref: "#/components/schemas/HyperReference"
  EnabledState:
    $ref: "#/components/schemas/EnabledState"
  TargetSetPoint:
    type: number
  ImmediateLevelChangeUnsupported:
    type: boolean
  MinimumDaylightLevelSettings:
    $ref: "#/components/schemas/MinimumDaylightLevelSettings"
required:
  - EnabledState
