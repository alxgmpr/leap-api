# HAND-AUTHORED shared enum for the firmware type
# `leapobj.NetworkConfigurationType`, referenced but never defined by the
# extraction. Two fields carry it: IPv4Properties.Type (typed against this
# schema) and IPv4PropertiesUpdate.Type, the write-side type, which has no
# hand-refined schema.
type: string
description: |
  How an interface's IPv4 address is configured. The firmware extraction did
  not recover the full enum; the members below are every value observed on
  the wire, and unlisted values are possible.

  Observed on IPv4Properties.Type, one value per RA3 unit: `DHCP` on unit 1
  (v03.247, via /project/masterdevicelist/devices) and `StaticIP` on unit 2
  (the coverage-blind spec probe, on both
  /project/masterdevicelist/devices and /networkinterface/1). Caseta's
  capture never reaches an IPv4Properties object.

  The two members are what the two units happen to be configured as, not a
  demonstration that the type has exactly two -- a link-local or
  auto-configuration member would not be surprising.
enum:
  - DHCP
  - StaticIP
