# HAND-AUTHORED shared enum for the firmware type
# `leapobj.NetworkConfigurationType`, referenced but never defined by the
# extraction. Two fields carry it: IPv4Properties.Type (typed against this
# schema) and IPv4PropertiesUpdate.Type, the write-side type, which has no
# hand-refined schema.
type: string
description: |
  How an interface's IPv4 address is configured. The firmware extraction did
  not recover the full enum; the members below are every value observed on
  the wire, and unlisted values are possible.

  Observed on IPv4Properties.Type, in five instances across three corpora:

  - `DHCP` -- the original RA3 capture (v03.247, via
    /project/masterdevicelist/devices), and the Caseta spec probe
    (v01.123, via /networkinterface/1).
  - `StaticIP` -- the coverage-blind RA3 spec probe (v03.249), on
    /project/masterdevicelist, /project/masterdevicelist/devices and
    /networkinterface/1.

  Both members are therefore observed on RA3, and `DHCP` on both platforms.
  They are what the captured installations happen to be configured as, not
  a demonstration that the type has exactly two -- a link-local or
  auto-configuration member would not be surprising.
enum:
  - DHCP
  - StaticIP
