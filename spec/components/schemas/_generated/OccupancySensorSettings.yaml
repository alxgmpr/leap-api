type: object
properties:
  href:
    type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  Follows:
    $ref: "#/components/schemas/HyperReference"
  Timeout:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  Sensitivity:
    type: string
    description: "TODO(enum): members of OccupancySensorSensitivity were not
      recovered from the firmware extraction"
  PresetAssignmentUnsupported:
    type: boolean
required:
  - PresetAssignmentUnsupported
