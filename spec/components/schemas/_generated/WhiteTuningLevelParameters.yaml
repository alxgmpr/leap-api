type: object
properties:
  Level:
    type: number
  WhiteTuningLevel:
    $ref: "#/components/schemas/WhiteTuningLevel"
  DelayTime:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  FadeTime:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  IgnoreLevelAndTurnOn:
    type: boolean
