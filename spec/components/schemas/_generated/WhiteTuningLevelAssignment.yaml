type: object
properties:
  href:
    type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  AssignableResource:
    $ref: "#/components/schemas/HyperReference"
  Level:
    type: number
  FadeTime:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  DelayTime:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  WhiteTuningLevel:
    $ref: "#/components/schemas/WhiteTuningLevel"
