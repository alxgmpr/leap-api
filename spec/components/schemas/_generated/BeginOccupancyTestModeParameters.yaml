type: object
properties:
  TestType:
    type: string
    description: "TODO(enum): members of OccupancyTestType were not recovered from
      the firmware extraction"
  TestTimeout:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  OccupancyTimeout:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
required:
  - TestType
