type: object
properties:
  href:
    type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  AssignableResource:
    $ref: "#/components/schemas/HyperReference"
  Level:
    type: number
  DelayTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  FadeTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
