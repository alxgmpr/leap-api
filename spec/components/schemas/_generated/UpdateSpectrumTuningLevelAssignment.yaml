type: object
properties:
  AssignableResource:
    $ref: "#/components/schemas/HyperReference"
  Level:
    type: number
  DelayTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  FadeTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  Vibrancy:
    type: number
  AutoVibrancy:
    type: string
    description: "TODO(enum): members of EnabledState were not recovered from the
      firmware extraction"
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
