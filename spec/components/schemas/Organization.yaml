type: object
description: |
  The installer's business contact record, nested on `Contact` -- see
  `Contact.yaml`, which relaxed its own `Email`/`PrimaryPhone` on the same
  kind of evidence.

  Firmware marks all four fields non-pointer (always present), but Caseta
  v01.123 omits `AccountNumber`: its single installer record
  (`fixtures/spec-read-caseta.json`, /project/contactinfo) carries `Name`,
  `Phone` and `Email` and nothing else. Both RA3 corpora carry all four --
  the original capture (v03.247) and the coverage-blind spec probe
  (v03.249), whose /project/contactinfo bodies are byte-identical, so those
  are three observations of two distinct records. Relaxed to optional on
  that observed absence; the only platform disagreement among them is this
  field.

  The direction of the inference matters and is the same one `LoadController`
  records: an observed absence falsifies a non-pointer `required`, while
  presence on a small sample is not evidence for one. `Name`, `Phone` and
  `Email` stay required because no capture has omitted them, not because
  three records prove they cannot be.
properties:
  Name:
    type: string
  Phone:
    type: string
  Email:
    type: string
  AccountNumber:
    type: string
required:
  - Name
  - Phone
  - Email
