# HAND-AUTHORED shared enum for the firmware type
# `leapobj.NetworkInterfaceConnectedStatus`, referenced but never defined by
# the extraction. One field carries it in the refined tier:
# NetworkInterfaceStatus.ConnectedStatus.
#
# The members are the firmware's own closed set, recovered from the RA3
# `leap-server` binary -- the same binary `vendor/leap-*.json` was extracted
# from. `leap/resource.ConvertConnectionStatusToLEAPConnectedStatus` is an
# exhaustive `switch` over the three members below whose default returns
# `"unexpected ConnectionStatus: %v"`, so the set is closed on the firmware
# side. The set is identical to the sensor path's `leapobj.ConnectedStatus`
# (see ConnectedStatus.yaml); the firmware models the two fields as distinct
# named types that happen to share a vocabulary. `Connected` is the one
# member also seen on the wire, and the `Disconnected` the prior prose called
# "implied by the field's name" is now firmware-confirmed.
type: string
enum:
  - Unknown
  - Connected
  - Disconnected
description: |
  Connection state of a network interface. Firmware type
  `leapobj.NetworkInterfaceConnectedStatus`; members recovered from the RA3
  `leap-server` binary (see the file header). `Connected` is observed via
  /networkinterface/1/status on RA3 v03.249 and Caseta v01.123 and v01.124
  -- the only 200s any corpus has for that route, and they agree (the probe
  reached the processor over that very interface, so a disconnected reading
  was never in reach).
x-observed-values:
  - Connected
x-observed-census:
  Connected:
    spec-read-caseta: 1
    spec-read-caseta-bare: 1
    spec-read-ra3: 1
