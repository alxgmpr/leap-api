type: string
description: |
  Discriminator for how a scheduled event's time is determined. The firmware
  extraction did not recover the full enum (StartAndEndTime.SystemAwayEventType,
  NLOTime.NaturalLightOptimizationEventType, TimeclockEvent.TimeclockEventType,
  and OccGroupTime.EventType all reference this same named type as an open
  string, despite the differing property names); members below were
  recovered from StartAndEndTime.SystemAwayEventType (Caseta v01.123, via
  /system/away), NLOTime.NaturalLightOptimizationEventType (Caseta v01.123,
  via /system/naturallightoptimization), and TimeclockEvent.TimeclockEventType
  (RA3 v03.247, 2 instances, via /timeclockevent -- both `Astronomic`). The
  coverage-blind spec probe added 14 more TimeclockEvent observations on RA3
  unit 2, and with them the only `FixedTime` seen outside Caseta:
  /timeclockevent/6924. OccGroupTime.EventType and EventTime.TimeType are
  typed against this same schema by type-identity (matching marker text) but
  have zero direct fixture coverage of their own (see OccGroupTime.yaml and
  EventTime.yaml). Unlisted values are possible.
enum:
  - FixedTime
  - Astronomic
