# `AutoVibrancy` points at the shared EnabledState schema on firmware type
# identity (`leapobj.SpectrumTuningLevelParameters.AutoVibrancy` is
# `leapobj.EnabledState`). Command-parameter input, so no corpus observes it;
# the members come from the shared type -- see EnabledState.yaml.
type: object
properties:
  Level:
    type: number
  Vibrancy:
    type: number
  AutoVibrancy:
    $ref: "#/components/schemas/EnabledState"
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
  DelayTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  FadeTime:
    type: string
    pattern: ^P(?=.*\d)(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  IgnoreLevelAndTurnOn:
    type: boolean
