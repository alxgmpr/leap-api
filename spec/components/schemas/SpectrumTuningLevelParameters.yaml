type: object
properties:
  Level:
    type: number
  Vibrancy:
    type: number
  AutoVibrancy:
    type: string
    description: "TODO(enum): members of EnabledState were not recovered from the
      firmware extraction"
  ColorTuningStatus:
    $ref: "#/components/schemas/ColorTuningStatus"
  DelayTime:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  FadeTime:
    type: string
    pattern: ^P(?:\d+D)?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
    example: PT2S
  IgnoreLevelAndTurnOn:
    type: boolean
