# Refined from _generated/Device.yaml. Two deviations from a straight copy,
# both decided from fixture evidence (never from the Go name==type shape
# alone, per the Task 12 ruling not to generalize Task 10's
# ZoneExpandedStatus flatten):
#
# 1. FLATTENED: `DeviceBase` and `DeviceMiniDefinitionForMasterDeviceList`
#    are named fields whose Go type shares their field name -- an anonymous
#    embed, same class of bug as ZoneExpandedStatus. Captured `/device/{id}`
#    bodies (80 observed across both platforms) never have a "DeviceBase" or
#    "DeviceMiniDefinitionForMasterDeviceList" key; their fields (Name,
#    DeviceType, AssociatedArea, AssociatedControlStation from DeviceBase;
#    href, SerialNumber, NetworkInterfaces, IPL from
#    DeviceMiniDefinitionForMasterDeviceList) appear directly at the top
#    level alongside Device's own properties. Restructured as `allOf`
#    against both, so the union of their fields plus Device's own is
#    validated flat.
#
# 2. `required` trimmed: the firmware marks ProductReference,
#    DaylightCalibrationType, EngravingKit, and IsThisDevice non-pointer,
#    but none are close to universal across 80 observed devices
#    (ProductReference 0/80, DaylightCalibrationType 0/80, EngravingKit
#    6/80, IsThisDevice 4/80). All four relaxed to optional. `ModelNumber`
#    (80/80) and `AddressedState` (80/80) stay required.
type: object
allOf:
  - $ref: "#/components/schemas/DeviceBase"
  - $ref: "#/components/schemas/DeviceMiniDefinitionForMasterDeviceList"
properties:
  FullyQualifiedName:
    type: array
    items:
      type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  ModelNumber:
    type: string
  ProductReference:
    type: string
  DaylightCalibrationType:
    type: string
    description: "TODO(enum): members of DaylightCalibrationType were not recovered
      from the firmware extraction"
  RepeaterProperties:
    $ref: "#/components/schemas/RepeaterProperties"
  LocalZones:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  ButtonGroups:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  OccupancySensors:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  DaylightSensors:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  EngravingKit:
    type: string
    description: "TODO(enum): members of DeviceEngravingKit were not recovered from
      the firmware extraction"
  Manufactured:
    $ref: "#/components/schemas/ManufacturingDetails"
  OwnedLinks:
    type: array
    items:
      $ref: "#/components/schemas/Link"
  LinkNodes:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  DeviceRules:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  FirmwareImage:
    $ref: "#/components/schemas/FirmwareImage"
  DeviceFirmwarePackage:
    $ref: "#/components/schemas/FirmwarePackage"
  OccupancyAggregator:
    $ref: "#/components/schemas/HyperReference"
  Logger:
    $ref: "#/components/schemas/HyperReference"
  Databases:
    type: array
    items:
      $ref: "#/components/schemas/Database"
  DeviceClass:
    $ref: "#/components/schemas/DeviceClass"
  AddressedState:
    type: string
    description: "TODO(enum): members of AddressedState were not recovered from the
      firmware extraction"
  IsThisDevice:
    type: boolean
  PhysicalDeviceProperties:
    $ref: "#/components/schemas/PhysicalDeviceProperties"
  AssociatedLink:
    $ref: "#/components/schemas/HyperReference"
required:
  - ModelNumber
  - AddressedState
