# Refined from _generated/Device.yaml. Two deviations from a straight copy,
# both decided from fixture evidence (never from the Go name==type shape
# alone, per the Task 12 ruling not to generalize Task 10's
# ZoneExpandedStatus flatten):
#
# 1. FLATTENED: `DeviceBase` and `DeviceMiniDefinitionForMasterDeviceList`
#    are named fields whose Go type shares their field name -- an anonymous
#    embed, same class of bug as ZoneExpandedStatus. Captured `/device/{id}`
#    bodies (56 distinct devices observed across both platforms) never have
#    a "DeviceBase" or "DeviceMiniDefinitionForMasterDeviceList" key; their
#    fields (Name, DeviceType, AssociatedArea, AssociatedControlStation
#    from DeviceBase; href, SerialNumber, NetworkInterfaces, IPL from
#    DeviceMiniDefinitionForMasterDeviceList) appear directly at the top
#    level alongside Device's own properties. Restructured as `allOf`
#    against both, so the union of their fields plus Device's own is
#    validated flat.
#
# 2. `required` trimmed: the firmware marks ProductReference,
#    DaylightCalibrationType, EngravingKit, and IsThisDevice non-pointer,
#    but none are close to universal across the 56 distinct devices
#    observed at `GET /device/{id}` (ProductReference 0/56,
#    DaylightCalibrationType 0/56, EngravingKit 3/56, IsThisDevice 2/56 --
#    the two devices where IsThisDevice is true are, unsurprisingly, the
#    processor identifying itself: RA3 /device/435 and Caseta /device/1).
#    All four relaxed to optional. `ModelNumber` (56/56) and
#    `AddressedState` (56/56) stay required.
#
# 3. `AddressedState` points at the shared AddressedState schema rather than
#    shipping as an open string: its firmware type is `leapobj.AddressedState`,
#    identical to ControlStationDeviceAssociation.AddressedState, where the
#    two members were recovered. 93 Device observations across both platforms
#    and all four read corpora that return a Device produce exactly those two
#    -- `Addressed` 92, `Unaddressed` 1 (/device/3681, RA3 v03.247).
#    See AddressedState.yaml.
type: object
allOf:
  - $ref: "#/components/schemas/DeviceBase"
  - $ref: "#/components/schemas/DeviceMiniDefinitionForMasterDeviceList"
properties:
  FullyQualifiedName:
    type: array
    items:
      type: string
  Parent:
    $ref: "#/components/schemas/HyperReference"
  ModelNumber:
    type: string
  ProductReference:
    type: string
  DaylightCalibrationType:
    type: string
    description: "TODO(enum): members of DaylightCalibrationType were not recovered
      from the firmware extraction"
  RepeaterProperties:
    $ref: "#/components/schemas/RepeaterProperties"
  LocalZones:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  ButtonGroups:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  OccupancySensors:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  DaylightSensors:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  EngravingKit:
    type: string
    description: |
      TODO(enum): members of DeviceEngravingKit were not recovered from the
      firmware extraction. Three values are observed -- `Bedside`,
      `Kitchen`, `Custom`, one Caseta v01.123 device each (/device/35,
      /device/43, /device/52) -- and this field is still left open rather
      than closed on them, unlike the other multi-valued enums recovered in
      the same pass.

      The reason is in the firmware, not the fixtures.
      `leapobj.DeviceHeard.EngravingKit` -- the same concept, on the
      discovery-side type -- is a bare Go `string`, not
      `leapobj.DeviceEngravingKit`. Firmware does not treat this vocabulary
      as closed everywhere it appears, engraving kits are a purchasable
      catalog rather than a protocol vocabulary, and three devices in one
      Caseta project is a sample of that catalog, not an enumeration of it.
      `Custom` sitting alongside two room names says the same thing.

      Values seen to date are recorded under `x-observed-values`, as
      documentation rather than as an assertion.
    x-observed-values:
      - Bedside
      - Kitchen
      - Custom
  Manufactured:
    $ref: "#/components/schemas/ManufacturingDetails"
  OwnedLinks:
    type: array
    items:
      $ref: "#/components/schemas/Link"
  LinkNodes:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  DeviceRules:
    type: array
    items:
      $ref: "#/components/schemas/HyperReference"
  FirmwareImage:
    $ref: "#/components/schemas/FirmwareImage"
  DeviceFirmwarePackage:
    $ref: "#/components/schemas/FirmwarePackage"
  OccupancyAggregator:
    $ref: "#/components/schemas/HyperReference"
  Logger:
    $ref: "#/components/schemas/HyperReference"
  Databases:
    type: array
    items:
      $ref: "#/components/schemas/Database"
  DeviceClass:
    $ref: "#/components/schemas/DeviceClass"
  AddressedState:
    $ref: "#/components/schemas/AddressedState"
  IsThisDevice:
    type: boolean
  PhysicalDeviceProperties:
    $ref: "#/components/schemas/PhysicalDeviceProperties"
  AssociatedLink:
    $ref: "#/components/schemas/HyperReference"
required:
  - ModelNumber
  - AddressedState
