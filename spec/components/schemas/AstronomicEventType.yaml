type: string
description: |
  Sunrise/sunset anchor for an astronomic-scheduled event. The firmware
  extraction did not recover the full enum; members below were recovered
  from hardware, and unlisted values are possible.

  Observed on TimeclockEventBase.AstronomicEventType, flattened onto both
  types that embed it: 6 NLOTime instances on Caseta (`Sunrise` and
  `Sunset` via /system/naturallightoptimization, the same pair in each of
  the three Caseta corpora -- the original source of these two members, and
  identical on the bare bridge, which ships this optimization configured
  before any device exists) and
  14 TimeclockEvent observations across the two RA3 corpora (`Sunset` 9,
  `Sunrise` 5, via /timeclockevent and
  /timeclockevent/{timeclockeventId}), which the coverage-blind spec probe
  contributed 12 of.

  EventTime.AstronomicEventType carries the same firmware type
  (`leapobj.AstronomicEventType`) and is typed against this schema by type
  identity; no corpus ever populates an EventTime.
enum:
  - Sunrise
  - Sunset
