# Copied verbatim from _generated/TimeclockEventRule.yaml. The one observed
# instance carries all three firmware-required fields, so nothing needed
# relaxing.
type: object
description: |
  One row of the processor's timeclock-event capacity limits. One observed
  instance, Caseta v01.123 (`fixtures/spec-read-caseta.json`,
  /project/timeclockeventrules): `{"MaxAllowed": 50,
  "MaxExceptionDatesPerEvent": 0, "MaxDatesPerEvent": 0}`. RA3 v03.249
  answers that route `404 NotFound`.

  `MaxDatesPerEvent` and `MaxExceptionDatesPerEvent` are worth reading
  alongside `TimeclockEvent.Dates` and its three siblings, whose firmware
  type is `leapobj.DateList` (non-pointer on `TimeclockEvent` itself;
  pointer on some fields of `TimeclockEventCreate`/`Update`): the firmware
  quantifies "dates per event" as a bounded count, which is a property a
  list has and an enum does not. This endpoint was the strongest of the
  four reasons those fields were retyped from an open string to an array of
  `Date` -- see `TimeclockEvent.yaml`, whose description carries the full
  argument, including which parts of it are inferred.

  Two cautions this body invites and does not support. The mapping of the
  two limit names onto the four fields is a reading of the names, not
  something the wire states. And Caseta's bound of `0` does not explain
  Caseta's timeclock events: **this bridge returns no TimeclockEvent at
  all** (`/timeclockevent` is `204 NoContent` on all three Caseta corpora,
  including the bare bridge, which ships a timeclock and no events). The
  observed TimeclockEvents -- 16 occurrences of 7 distinct objects, all
  `ScheduleType: "DayOfWeek"` and none carrying any of the four fields --
  are RA3's, and RA3 answers this rules route `404 NotFound`. The bound and
  the empty events agree; they are not the same system reporting both.
properties:
  MaxAllowed:
    type: integer
    minimum: 0
    maximum: 4294967295
  MaxExceptionDatesPerEvent:
    type: integer
    minimum: 0
    maximum: 4294967295
  MaxDatesPerEvent:
    type: integer
    minimum: 0
    maximum: 4294967295
required:
  - MaxAllowed
  - MaxExceptionDatesPerEvent
  - MaxDatesPerEvent
