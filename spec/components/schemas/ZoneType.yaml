type: string
description: |
  Zone control type. The firmware extraction did not recover the full enum
  (Zone.ControlType and Zone.AvailableControlTypes shipped as open strings);
  members below were recovered from Zone.ControlType and
  Zone.AvailableControlTypes observed on RA3 v03.247 and Caseta v01.123.
  Across all four read corpora Zone.ControlType now gives `Dimmed` 94,
  `Switched` 17, `CCO` 3 and `FanSpeed` 2; `Dimmed` is the only value ever
  seen inside AvailableControlTypes. ZoneTypeGroupAbridged.Type carries the
  same firmware type and is typed against this schema by type identity,
  though nothing in the corpus populates it. Unlisted values are possible.
enum:
  - CCO
  - Dimmed
  - FanSpeed
  - Switched
