type: string
description: |
  Whether a device has completed addressing on its network. The firmware
  extraction did not recover the full enum; members below were recovered
  from ControlStationDeviceAssociation.AddressedState (nested inside
  ControlStation.AssociatedGangedDevices, via
  /area/{areaId}/associatedcontrolstation) on RA3 v03.247. Unlisted values
  are possible.

  Note: Device.AddressedState and DeviceMiniDefinitionForMasterDeviceList's
  own AddressedState field carry the identical firmware type name and the
  same two observed values (`Addressed`, `Unaddressed`, see the device
  family's Device.yaml/DeviceMiniDefinitionForMasterDeviceList.yaml
  comments), but were left as open strings there -- out of this task's
  scope (a different family's already-committed file). A future pass could
  point those fields at this schema.
enum:
  - Addressed
  - Unaddressed
