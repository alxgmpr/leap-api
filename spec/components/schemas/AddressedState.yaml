type: string
description: |
  Whether a device has completed addressing on its network. The firmware
  extraction did not recover the full enum; members below were recovered
  from hardware. Unlisted values are possible.

  Two fields carry the firmware type `leapobj.AddressedState` and both are
  typed against this schema:

  - `ControlStationDeviceAssociation.AddressedState` (nested inside
    ControlStation.AssociatedGangedDevices, via
    /area/{areaId}/associatedcontrolstation and /controlstation/{id}):
    `Addressed` 78, `Unaddressed` 2 -- the original RA3 capture (v03.247,
    30/1) and the coverage-blind spec probe (v03.249, 34/1), plus 7 each
    from the sweep read and write corpora. No Caseta corpus returns a
    control station at all. This is where the two members were originally
    recovered.
  - `Device.AddressedState` (via /device, /device/{deviceId} and
    /project/masterdevicelist/devices): `Addressed` 92 -- RA3 v03.247 32,
    Caseta v01.123 48 + 4, RA3 v03.249 8 -- and `Unaddressed` 1 (RA3
    v03.247, /device/3681). Left as an open string when this schema was
    first written -- "a future pass could point that field here" -- and
    pointed here in the Task 13 enum pass, which is that future pass. Both
    platforms and all four read corpora that return a Device agree on the
    same two members, and no third value has appeared in 93 observations.

  The earlier version of this note also named
  `DeviceMiniDefinitionForMasterDeviceList.AddressedState` as a third site.
  That was wrong: neither the firmware type nor the schema has such a
  field. The type's own comment mentions AddressedState only to identify
  which device (/device/3681, the `Unaddressed` one) is missing a
  SerialNumber -- and that device's AddressedState is the flattened
  `Device.AddressedState` above.
enum:
  - Addressed
  - Unaddressed
