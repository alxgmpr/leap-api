      the firmware extraction"
  EngravingKit:
    type: string
  DeviceClass:
    $ref: "#/components/schemas/DeviceClass"
  Link:
    $ref: "#/components/schemas/Link"
required:
  - DiscoveryMechanism
  - ModelNumber
  - DeviceType
  - SerialNumber
  - RelationshipStatus
  - EngravingKit
