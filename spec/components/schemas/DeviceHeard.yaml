    $ref: "#/components/schemas/DiscoveryMechanism"
  UnassociatedDeviceDiscoverySession:
    $ref: "#/components/schemas/HyperReference"
  ModelNumber:
    type: string
  DeviceType:
    type: string
  SerialNumber:
    type: integer
    minimum: 0
    maximum: 4294967295
  PairedDevices:
    $ref: "#/components/schemas/PairedDevices"
  WiredSensors:
    $ref: "#/components/schemas/WiredSensors"
  ErrorCode:
    type: integer
    minimum: 0
    maximum: 4294967295
  RelationshipStatus:
