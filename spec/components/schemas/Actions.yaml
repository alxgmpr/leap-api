type: array
description: |
  Body of a `ReadRequest` on the `/system/action` collection (MessageBodyType
  `Actions`; the wire wraps this array as `{"Actions": [...]}`, unwrapped
  here per the MessageBodyType convention). Not present in the firmware
  route-table extraction at all (zero `system/action` entries recovered).
  Hand-authored from captured Caseta v01.123 traffic (200 OK, two `Action`
  objects observed, each a `PressAndRelease` command to a virtual button --
  see `Command.yaml`); RA3 v03.247 returns 400 BadRequest for the same
  route (Caseta-only feature per index.md's "Caseta-Only Features" section).
