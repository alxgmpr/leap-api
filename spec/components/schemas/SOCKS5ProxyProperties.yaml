# `EnabledState` points at the shared EnabledState schema on firmware type
# identity (`leapobj.SOCKS5ProxyProperties.EnabledState` is
# `leapobj.EnabledState`). Directly observed once, too: the coverage-blind
# spec probe's /networkinterface/1 (RA3 unit 2) carries
# `SOCKS5ProxyProperties: {"EnabledState": "Disabled"}`.
type: object
properties:
  EnabledState:
    $ref: "#/components/schemas/EnabledState"
  Hostname:
    type: string
  Port:
    type: integer
    minimum: 0
    maximum: 65535
required:
  - EnabledState
