# `EnabledState` points at the shared EnabledState schema on firmware type
# identity (`leapobj.SOCKS5ProxyProperties.EnabledState` is
# `leapobj.EnabledState`). Directly observed once, too: the coverage-blind
# spec probe's /networkinterface/1 on RA3 v03.249 carries
# `SOCKS5ProxyProperties: {"EnabledState": "Disabled"}`. The Caseta probe's
# /networkinterface/1 omits the whole object, corroborating the optionality
# firmware already declares -- `leapobj.NetworkInterface` types the field
# `*leapobj.SOCKS5ProxyProperties`, a pointer, so NetworkInterface never
# required it. The `required: [EnabledState]` below applies only when the
# object is present.
type: object
properties:
  EnabledState:
    $ref: "#/components/schemas/EnabledState"
  Hostname:
    type: string
  Port:
    type: integer
    minimum: 0
    maximum: 65535
required:
  - EnabledState
