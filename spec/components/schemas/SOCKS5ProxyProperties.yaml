# `EnabledState` points at the shared EnabledState schema on firmware type
# identity (`leapobj.SOCKS5ProxyProperties.EnabledState` is
# `leapobj.EnabledState`). Directly observed once, too: the coverage-blind
# spec probe's /networkinterface/1 on RA3 v03.249 carries
# `SOCKS5ProxyProperties: {"EnabledState": "Disabled"}`. The Caseta probe's
# /networkinterface/1 omits the whole object, which is why NetworkInterface
# does not list this property in its own `required`.
type: object
properties:
  EnabledState:
    $ref: "#/components/schemas/EnabledState"
  Hostname:
    type: string
  Port:
    type: integer
    minimum: 0
    maximum: 65535
required:
  - EnabledState
