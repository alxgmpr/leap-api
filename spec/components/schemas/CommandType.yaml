type: string
description: |
  Discriminator for `Command` (see `Command`'s description for the full
  CommandType-to-parameter-field mapping). `Command.CommandType` is typed
  `leapobj.CommandType`, one of the 118 named types the extraction
  references at a field position and never defines -- it recovers Go
  `struct` definitions only, and a Go string enum is `type X string` plus
  consts, so no member list survives extraction for this or for any other
  enum here (see `OccupancyStatus.yaml`). Members below were recovered from app
  reverse engineering, not captured traffic, with one exception
  (`PressAndRelease`, confirmed via a live Caseta probe response body).
  **Observed-not-exhaustive**: unlisted values are possible, and several
  command families documented in the sources are deliberately excluded here
  rather than guessed -- see below.

  Sources, cited per member in `Command`'s description as `api-discovery.md`
  and `index.md` (both live in the separate `lutron-protocols` source
  repository this project was built against, under
  `docs/protocols/leap/`, not in this repository):
  - `api-discovery.md` (`lutron-protocols` `docs/protocols/leap/api-discovery.md`)
    -- decompiled from the Android APK, `com.lutron.lsb` v26.1.0.4 (jadx).
    Confirms `@JsonClassDiscriminator("CommandType")`, i.e. these are the
    literal wire discriminator strings, not internal class names.
  - `index.md` (`lutron-protocols` `docs/protocols/leap/index.md`), "Route
    Reference (from iOS App Binary RE)" section -- decompiled from Lutron
    iOS app v26.0.0 (`com.lutron.lsb`, build 8; the source document's own
    package identifier, despite the "iOS" heading).
  - `index.md`, "System Actions" section -- one live-captured Caseta v01.123
    response body (`PressAndRelease`), not app RE.
  - A live write probe against RA3/HWQS firmware v03.x (`GoToScene`) -- see
    that member's own note below. It is the only member whose *effect* has
    been observed, not merely its acceptance.

  Deliberately NOT included, to avoid inventing values from a name's shape:
  - The Android APK's `*CommandBody` wrapper class names for zone shade-limit
    calibration and tuning (`EnterShadeLimitSetModeCommandBody`,
    `ExitShadeLimitSetModeCommandBody`, `ShadeLimitLowerLiftCommandBody`,
    `ShadeLimitRaiseLiftCommandBody`, `ShadeLimitSaveClosedLiftCommandBody`,
    `ShadeLimitSaveOpenLiftCommandBody`, `TestCloseLimitCommandBody`,
    `TestOpenLimitCommandBody`, `CommandTuningSettingsBody`). Stripping the
    `CommandBody` suffix to guess a CommandType is exactly the kind of
    name-shape inference this task was told to avoid -- and it's
    demonstrably unreliable here: the same source's Device-family body
    class `AssignmentCommandBody` corresponds to CommandType `AddressDevice`
    and `UnassignmentCommandBody` to `UnaddressDevice`, neither a suffix
    match. The zone and loadcontroller command processors are known (from
    this same table) to accept commands wrapped in these classes; the exact
    wire strings are not established.
  - iOS RE bullet items ending in the literal suffix `Command`
    (`ShadeLimitCommand`, `CCOZoneGotoLevelCommand`,
    `ReceptacleZoneGotoLevelCommand`) -- inconsistent with every confirmed
    CommandType's naming (plain PascalCase verb phrase, never
    `*Command`-suffixed), read as informal class/selector paraphrases in the
    source prose rather than literal wire values. CCO and receptacle zone
    commands are real (the firmware struct has `CCOLevelParameters` and
    `ReceptacleLevelParameters` fields), but their CommandType strings are
    not established.
  - The iOS RE table's `IdentifyCommand` sub-commands are written as bare
    "Start, Stop (flash LED)" -- read as a paraphrase of the Android table's
    confirmed `StartIdentify`/`StopIdentify`, not two additional members.
  - Vague endpoint-only mentions with no named value ("DayNightMode
    commands", "NaturalShow commands", "PresetAssignment commands" in
    api-discovery.md's Other Command Endpoints table).
enum:
  # api-discovery.md, Android APK RE, "Zone Commands" table
  - GoToDimmedLevel
  - GoToSwitchedLevel
  - GoToShadeLevel
  - GoToShadeLevelWithTilt
  - GoToShadeLevelWithTiltWhenClosed
  - GoToTilt
  - GoToSpectrumTuningLevel
  - GoToWhiteTuningLevel
  - GoToWarmDim
  - GoToMixedLevel
  - Raise
  - Lower
  - Stop
  # api-discovery.md, Android APK RE, "Device Commands" table
  - AddressDevice
  - UnaddressDevice
  - StartIdentify
  - StopIdentify
  - CloudProvision
  # api-discovery.md, Android APK RE, "Link Commands" table
  - CacheDeviceHeard
  - RequestBeginUnassociatedDeviceDiscovery
  # api-discovery.md, Android APK RE, "Other Command Endpoints" table /
  # "ApplyDatabaseCommand" and "BeginTransferSessionCommand" sections
  - ApplyNow
  - BeginTransferSession
  # api-discovery.md, Android APK RE, "Other Command Endpoints" table
  - SystemStatusUpdate
  # Live write probe, RA3/HWQS firmware v03.x. This string was previously
  # excluded here as unconfirmed name-shape inference from
  # `GoToSceneRequestCreator`; it is now confirmed on hardware. A
  # `CreateRequest` to `/area/{areaId}/commandprocessor` carrying
  # `{"CommandType": "GoToScene", "GoToSceneParameters": {"CurrentScene":
  # {"href": "/areascene/<id>"}}}` answered `204 NoContent` and the area's
  # zones moved to the scene's levels and back, fired both ways. The
  # alternatives were falsified in the same probe: the same body to
  # `/preset/{id}/commandprocessor` answers
  # `400 "This command is not supported: \"GoToScene\""`,
  # `/areascene/{id}/commandprocessor` answers 405, and an `UpdateRequest`
  # to `/area/{id}/status` setting `CurrentScene` answers 405. All 39
  # members documented here at the time were tried against
  # `/preset/{id}/commandprocessor`; only `StartIdentify`/`StopIdentify`
  # were recognised, which is what sent the search to the firmware's
  # `GoToSceneParameters` field and then to the area route.
  - GoToScene
  # index.md, iOS app RE, "Non-Zone Command Classes" table (Sub-commands column)
  - GoToGroupLightingLevel
  - EditDayNightMode
  - GenerateLogPackage
  - EditNaturalShowRamp
  - Filter
  - DeviceDiscovery
  - TestHighEndTrim
  - TestLowEndTrim
  # index.md, iOS app RE, "Zone Commands (via /zone/{id}/commandprocessor)" section
  - GoToFanSpeed
  - GoToBrightnessLevel
  - GoToVibrancyLevel
  - EnableAutoVibrancy
  - GoToCurveDimming
  - GoToNaturalShow
  - StopIfMoving
  # index.md, "System Actions" section -- captured Caseta v01.123 response body
  - PressAndRelease
