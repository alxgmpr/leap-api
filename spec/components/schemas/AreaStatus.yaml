# `OccupancyStatus` points at the shared OccupancyStatus schema (firmware
# type `leapobj.OccupancyStatus`, shared with
# OccupancyGroupStatus.OccupancyStatus). This field is where `Occupied` and
# `Unoccupied` were finally observed: the 8 area statuses the coverage-blind
# spec probe reaches on RA3 v03.249 give `Unknown` 4, `Unoccupied` 3,
# `Occupied` 1. See OccupancyStatus.yaml.
type: object
properties:
  href:
    type: string
  Level:
    type: number
    description: |
      Read-only-visible in practice: present in a read and in the
      subscribe-time snapshot, never in a push, even when it changes. Driving
      a zone in the area produces a `CurrentScene` push and a metering push
      on `/area/{areaId}/status`, and a level push on `/zone/status`, but no
      area `Level`. A client tracking this field from a subscription alone
      holds the value the area had when it subscribed.

      Observed to equal the highest `Level` among the area's zones with
      `Category.IsLight` true, on all 19 areas of an HWQS v03.249 system;
      zones that are not lights are excluded. See docs/subscriptions.md.
  OccupancyStatus:
    $ref: "#/components/schemas/OccupancyStatus"
  InstantaneousPower:
    type: integer
    minimum: 0
    maximum: 4294967295
    description: |
      A calculation, not a measurement. At full output an area reports
      exactly its own `InstantaneousMaxPower` — measured on two areas of an
      HWQS v03.249 system, 40 of 40 and 10 of 10 — which is the programmed
      load wattage scaled by level. The dimmers on that system have no
      current sensing.

      Push-only and sporadic: it appears in no read (0 of 19 areas), and a
      subscriber sees it at the processor's own cadence rather than on
      change. One area was held at 0% for two minutes after reporting 10 W
      and no correcting push arrived, so the last value a client holds may
      describe a state the system has left.
  InstantaneousMaxPower:
    type: integer
    minimum: 0
    maximum: 4294967295
    description: |
      The area's programmed load wattage — the sum Designer was given, not a
      rating discovered from hardware. `InstantaneousPower` equals this
      exactly at full output.
  CurrentScene:
    description: |
      Nullable: the wire sends an explicit JSON `null` for an area with no
      scene currently active, rather than omitting the key. Observed on 4 of
      the 8 probed areas (RA3 v03.249, via /area/{areaId}/status):
      `/area/3/status`, `/area/32/status`, `/area/1208/status` and
      `/area/1232/status` all carry `"CurrentScene": null`, while
      `/area/912/status`, `/area/1220/status`, `/area/1244/status` and
      `/area/1256/status` carry a real reference (e.g.
      `{"href": "/areascene/916"}`). No probed area omits the key entirely.

      Firmware and hardware agree here -- the loss is the generator's.
      Firmware types the field `CurrentScene **leapobj.HyperReference` (a
      double pointer): the
      outer pointer carries presence, the inner one carries null-vs-value,
      which is exactly the "explicit null" encoding observed. The Go struct
      parser strips pointers at any depth to a single `optional` flag (see
      lib/go-struct-parser.ts), so the null-vs-absent distinction never
      reached the generated schema and `CurrentScene` came out as a bare
      `$ref`. Restored here as a `oneOf` against `HyperReference` or the
      JSON Schema `null` type -- these schemas are JSON Schema 2020-12, so
      `type: "null"` is available; a `$ref`-plus-`type` sibling
      would not work, since `null` cannot also satisfy `HyperReference`
      (which requires `href`).

      The double pointer is not unique to this field. The extraction has 40
      `**` fields across 17 types; 37 of them are on `*Update` request
      types, where a double pointer is the ordinary Go partial-update idiom
      (distinguishing "leave alone" from "set to null"). On non-update
      response types there are three: `ColorTuningStatus.CurveDimming`,
      `WarmDimParameters.CurveDimming`, and this one. `CurrentScene` is
      simply the only one of the three this project has wire evidence for.
    oneOf:
      - $ref: "#/components/schemas/HyperReference"
      - type: "null"
required:
  - OccupancyStatus
