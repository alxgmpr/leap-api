# HAND-AUTHORED. Shipped as a closed one-member `enum` until this pass --
# see the description for why it is an open string now.
type: string
description: |
  Role granted to the connected client's session, from
  `Permissions.SessionRole` (firmware type `leapobj.SessionRole`) via
  /clientsetting.

  **Open string, not an enum.** This shipped as a closed **one-member**
  `enum`, and one member is the case where the `enum` adds nothing:
  `enum: [Admin]` and `x-observed-values: [Admin]` assert the same
  *content*. The only thing the `enum` adds is "and nothing else, ever" --
  an exhaustiveness claim on a sample that has never once shown this field
  to vary. Opening drops that and loses no evidenced content, and it moves
  the claim somewhere machine-checked in both directions
  (`test/observed-values.test.ts`), which the `enum` never was for
  frame-log bodies.

  **That is not a general licence to reopen**, and the limit is stated here
  so this file does not read as one. 24 closed enums still ship in this
  specification, every one beside a note of its own saying the member list
  is not exhaustive, and they stay closed because something evidences the
  extent of their set: 23 have every declared member independently observed
  in the fixtures, and `CommandType` has a documented non-wire source for
  its 39 (decompiled Lutron app binaries), of which only
  `PressAndRelease` was ever seen on the wire.

  **Neither ground claims the set is complete.** Every closed enum here is a
  lower bound, and a later corpus can still falsify one: `ServiceType` had
  all 8 of its declared members independently observed and was falsified
  anyway, by a ninth value on a later probe. What this field had was neither
  ground at all -- one observed value, and no member list from anywhere else
  -- which makes it the **weakest case on the same scale**, not a different
  kind of case. Firmware typing does not separate the cases either: it is
  typed `leapobj.SessionRole`, a named type the
  extraction never defined, and so is every one of those 24. See
  `OccupancyStatus.yaml`, which records the criterion in full and the
  ruling it reverses.

  **The evidence is weaker here than a bare count suggests, and the count
  itself was wrong.** `Admin` is observed four times, in the corpora
  labelled `sweep-read`, `spec-read-ra3`, `spec-read-caseta` and
  `spec-read-caseta-bare` -- so on both platforms, and on two of the three
  Caseta corpora rather than one. The description said "three corpora" and
  named three fixture files; the fourth, the v01.124 bare bridge, answers
  /clientsetting `200 OK` with
  `Permissions.SessionRole: Admin` exactly as the others do. Per-corpus
  counts are under `x-observed-census`.

  All four are the same observation repeated: every one reports the role of
  *this project's own prober*, on that prober's own session. They say what
  that client was granted, not what the type can hold. A non-admin
  integrator or guest role is plausible and unconfirmed by any capture in
  this project's corpus -- which is a statement about the corpus, not about
  the type, and is why nothing here is closed on it.
x-observed-values:
  - Admin
x-observed-census:
  Admin:
    spec-read-caseta: 1
    spec-read-caseta-bare: 1
    spec-read-ra3: 1
    sweep-read: 1
