# HAND-AUTHORED. Shipped as a closed one-member `enum` until this pass --
# see the description for why it is an open string now.
type: string
description: |
  Button group category, from `ButtonGroupCategory.Type` (firmware type
  `leapobj.ButtonGroupCategoryType`).

  **Open string, not an enum.** This shipped as a closed **one-member**
  `enum`, and one member is the case where the `enum` adds nothing:
  `enum: [Lights]` and `x-observed-values: [Lights]` assert the same
  *content*. The only thing the `enum` adds is "and nothing else, ever" --
  an exhaustiveness claim on a sample that has never once shown this field
  to vary. Opening drops that and loses no evidenced content, and it moves
  the claim somewhere machine-checked in both directions
  (`test/observed-values.test.ts`), which the `enum` never was for
  frame-log bodies.

  **That is not a general licence to reopen**, and the limit is stated here
  so this file does not read as one. 24 closed enums still ship in this
  specification, every one beside a note of its own saying the member list
  is not exhaustive, and they stay closed because something evidences the
  extent of their set: 23 have every declared member independently observed
  in the fixtures, and `CommandType` has a documented non-wire source for
  its 39 (decompiled Lutron app binaries), of which only `PressAndRelease`
  has ever been observed **as a `CommandType`**. (`Raise` and `Lower` do
  appear on the wire, but as the two members of `RaiseLowerDirection`,
  under `Direction` -- a different enum that happens to share those two
  names.)

  **Neither ground claims the set is complete.** Every closed enum here is a
  lower bound, and a later corpus can still falsify one. **Four already
  have** -- which is every falsification in this specification's history --
  and three of the four satisfied the first ground in full when they fell:
  `ServiceType` had all 8 of its declared members independently observed and
  a ninth arrived on a later probe; `ServerType` had both of its 2 observed
  and a third arrived from a second platform; `ProgrammingModelType` had all
  5 observed and a sixth arrived on a later RA3 build. One of the four was
  reopened and three were extended, on the split `OccupancyStatus.yaml` sets
  out.

  **The fourth falsification is the one this file should be read against.**
  `OccupancyStatus` shipped closed on a single observed member, `Unknown`,
  with no member list from anywhere else -- exactly this field's profile --
  and one coverage-blind probe returned `Occupied` and `Unoccupied`
  together. So what this field has is neither ground at all, which makes it
  the **weakest case on the same scale**, not a different kind of case -- and
  there is already a worked example of what closing on that much evidence
  costs. Firmware typing does not decide *this* question -- it
  decides only whether an already-falsified set reopens or is extended, and
  nothing here has been falsified. This field is typed
  `leapobj.ButtonGroupCategoryType`, a named type the extraction never
  defined, and so is every one of those 24, so typing cannot separate them.
  See `OccupancyStatus.yaml`, which records the criterion in full and the
  ruling it reverses.

  `Lights` is observed 20 times across three corpora -- RA3 v03.247 4,
  Caseta v01.123 10, RA3 v03.249 6, counted per corpus under
  `x-observed-census` -- via /buttongroup, /buttongroup/{buttongroupId},
  /device/{deviceId}/buttongroup and its /expanded form.

  **Do not re-derive this by walking for `Category.Type`.** The firmware has
  **ten** types that carry a `Type` field and are used at a field named
  `Category` -- `AreaCategory`, `AreaCategoryUpdate`, `ButtonGroupCategory`,
  `EmergencyCategory`, `EmergencyCategoryUpdate`, `ThirdPartyDeviceCategory`,
  `ThirdPartyDeviceCategoryCreate`, `VirtualButtonCategory`, `ZoneCategory`
  and `ZoneCategoryUpdate`. **Four** of the ten reach the fixtures, which
  carry 387 such strings in all. Only the 20
  below are this type. The other
  367 split three ways, not one: `Zone.Category`
  (`leapobj.ZoneCategory`) 310, of which 241 are the empty string;
  `Area.Category` (`leapobj.AreaCategory`) 51; and `VirtualButton.Category`
  (`leapobj.VirtualButtonCategory`) 6.

  Two of those three are not enum-shaped at all: `ZoneCategory.Type` and
  `AreaCategory.Type` are bare Go `string`s, with no named type behind them
  the way `Service.Type` has none, and this specification carries both as
  plain `type: string` with no member list of any kind. That is a similarity
  to `ServiceType`'s firmware typing, but it does not make them the same
  case: what opened `ServiceType` was hardware falsifying a closed `enum` it
  had shipped, with the bare typing deciding only that it reopened rather
  than being extended -- see `OccupancyStatus.yaml`. Neither of these two
  ever shipped a member list to falsify. Only `VirtualButtonCategory.Type`
  is a named type, and it is a different named type
  (`leapobj.VirtualButtonCategoryType`).

  Nor do the values sort themselves out by inspection. `Kitchen` occurs 5
  times as an area category and 4 as a virtual-button category and never as
  a zone one; `Bathroom` 6 times as an area category and never as a zone
  one. The four are separated by their container -- not by their key, and
  not by their value. `npm run census` is schema-aware and does not have
  this problem; a hand-rolled walker does.

  The Caseta spec probe contributes none, but not for want of coverage: it
  reaches exactly one button group (`/buttongroup/1`, via
  /device/1/buttongroup, `200 OK`) and that group carries no `Category` key
  at all. Absence of the key, not absence of the object -- the same button
  group is what `StopIfMovingEnabledState.yaml` counts as its 20th
  observation. `Category` is optional on ButtonGroup generally: only 2 of
  the 16 button groups the original RA3 capture returns carry it, and 5 of
  10 on the original Caseta capture.
x-observed-values:
  - Lights
x-observed-census:
  Lights:
    caseta: 10
    ra3: 4
    spec-read-ra3: 6
