type: object
description: |
  Firmware marks `Email` and `PrimaryPhone` non-pointer (always present),
  but the single observed instance (RA3 v03.247, via /project/contactinfo)
  omits both -- its email/phone are carried on the nested `Organization`
  instead. Relaxed to optional on hardware evidence (Caseta v01.123 returns
  204 on this route, so unconfirmed there).
properties:
  href:
    type: string
  Role:
    $ref: "#/components/schemas/Role"
  Name:
    $ref: "#/components/schemas/ContactName"
  Organization:
    $ref: "#/components/schemas/Organization"
  Email:
    type: string
  PrimaryPhone:
    type: string
required:
  - Role
