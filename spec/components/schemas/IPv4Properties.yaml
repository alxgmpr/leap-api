# Refined from _generated/IPv4Properties.yaml. `required` trimmed: the
# firmware marks IP, SubnetMask, Gateway, DNS1, DNS2, and DNS3 non-pointer,
# but the only instance observed at the time (RA3 v03.247, via
# /project/masterdevicelist/devices, Type "DHCP") has none of them -- just
# `Type`. Discovered when wiring up GET /project/masterdevicelist/devices'
# response schema (Devices -> Device -> ... -> IPv4Properties) surfaced the
# first captured traffic ever validated against this schema. Consistent
# with a DHCP-configured interface simply not reporting the fields a static
# configuration would carry; relaxed all six to optional pending a captured
# static-IP instance. Only `Type`, the sole field observed, stays required.
#
# The static-IP instance that note was waiting on has since arrived, and it
# confirms the relaxation rather than reversing it: the coverage-blind spec
# probe on RA3 v03.249 reports `{"Type": "StaticIP", "IP": ...}` and nothing
# else under /project/masterdevicelist/devices, while the same interface
# fetched directly at /networkinterface/1 reports IP, SubnetMask, Gateway,
# DNS1 and DNS2 -- so even a static configuration omits most of these
# fields depending on which route serves it, and DNS3 is unobserved
# anywhere. All six stay optional.
#
# The Caseta spec probe then supplied the counterexample to the *original*
# inference above: its /networkinterface/1 is `{"Type": "DHCP", "IP": ...,
# "SubnetMask": ..., "Gateway": ..., "DNS1": ...}`. A DHCP-configured
# interface does report those fields when the route serves them, so "DHCP
# simply does not have them" is not the explanation; which route serves the
# object is. The superseding explanation stands and is strengthened.
#
# All five observed instances, from the three corpora that reach one:
#   ra3.json               /project/masterdevicelist/devices  DHCP     (Type only)
#   spec-read.json         /project/masterdevicelist/devices  StaticIP (Type, IP)
#   spec-read.json         /project/masterdevicelist          StaticIP (Type, IP)
#   spec-read.json         /networkinterface/1                StaticIP (6 fields)
#   spec-read-caseta.json  /networkinterface/1                DHCP     (5 fields)
#
# `Type` points at the shared NetworkConfigurationType schema.
# See NetworkConfigurationType.yaml.
type: object
properties:
  Type:
    $ref: "#/components/schemas/NetworkConfigurationType"
  IP:
    type: string
  SubnetMask:
    type: string
  Gateway:
    type: string
  DNS1:
    type: string
  DNS2:
    type: string
  DNS3:
    type: string
required:
  - Type
