# HAND-AUTHORED shared enum for the firmware type `leapobj.Availability`,
# referenced but never defined by the extraction (so the generator emitted
# `TODO(enum): members of Availability ...` at every site). Three fields
# carry it: DeviceStatus.Availability and ZoneStatus.Availability, both
# typed against this schema, and DeviceAvailabilityStatus.Availability,
# which has no hand-refined schema yet.
type: string
description: |
  Whether the processor currently has a live view of the resource. The
  firmware extraction did not recover the full enum; the members below are
  every value observed on the wire, and unlisted values are possible -- a
  two-member set for a field named "availability" is very likely a lower
  bound, not the whole type.

  `DeviceStatus.Availability` (via /device/status and
  /device/{deviceId}/status): `Unknown` 85 -- RA3 v03.247 31, Caseta
  v01.123 46 + 2, RA3 v03.249 6 -- and `Available` 2 (both
  /device/435/status, the RA3 processor reporting on itself, once per RA3
  corpus). The lopsidedness is real and matches
  what the captures show elsewhere -- an idle processor reports `Unknown`
  for devices it has not heard from recently.

  `ZoneStatus.Availability` is never populated in any read corpus. Its two
  observations come from `fixtures/push-probe.json`, where the
  CreateResponse frames for a live level change on /zone/4664 carry
  `{"StatusAccuracy": "Good", "Availability": "Available"}` -- the same
  value, on the same firmware type, from the one capture that caught a zone
  mid-transaction.
enum:
  - Available
  - Unknown
