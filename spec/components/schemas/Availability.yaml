# HAND-AUTHORED shared enum for the firmware type `leapobj.Availability`,
# referenced but never defined by the extraction (so the generator emitted
# `TODO(enum): members of Availability ...` at every site). Three fields
# carry it: DeviceStatus.Availability and ZoneStatus.Availability, both
# typed against this schema, and DeviceAvailabilityStatus.Availability,
# which has no hand-refined schema yet.
type: string
description: |
  Whether the processor currently has a live view of the resource. The
  firmware extraction did not recover the full enum. `Available` and
  `Unknown` are observed on the wire; `Unavailable` is from app RE -- the
  Lutron Android app decompile (`com.lutron.lsb` v26.1.0.4, jadx;
  `lutron-protocols` `docs/protocols/leap/api-discovery.md`) enumerates the
  field as `Available`, `Unavailable`, `Unknown`, which is the lower bound
  the field name always suggested. **Observed-not-exhaustive**: the app
  enumerates the set it knows, and the firmware may accept more.

  `DeviceStatus.Availability` (via /device/status and
  /device/{deviceId}/status): `Unknown` 85 -- RA3 v03.247 31, Caseta
  v01.123 46 + 2, RA3 v03.249 6 -- and `Available` 2 (both
  /device/435/status, the RA3 processor reporting on itself, once per RA3
  corpus). The lopsidedness is real and matches
  what the captures show elsewhere -- an idle processor reports `Unknown`
  for devices it has not heard from recently.

  `ZoneStatus.Availability` is never populated in any read corpus, on either
  platform. Every zone-side observation comes from a frame log, and every
  one of them is a `CreateResponse` reply to a `CreateRequest` on a
  `/zone/{id}/commandprocessor` -- the reply carries
  `{"StatusAccuracy": "Good", "Availability": "Available"}` for the zone it
  just drove. **8 observations across 4 captures and both platforms**, all
  `Available`:

    fixtures/push-probe.json         2   /zone/4664/status   (seq 20, 24)
    push-experiments ra3-push-pad-0  2   /zone/4664/status   (seq 20, 23)
    push-experiments ra3-push-pad-7  2   /zone/4664/status   (seq 27, 30)
    push-experiments caseta-push-pad-0 2 /zone/2/status      (seq 8, 11)

  The last pair is the first Caseta observation of this field on a zone, so
  the value is no longer known through a single RA3 zone. The census is
  larger than it was and no more varied: 8 command replies on 2 zones on 2
  platforms all report `Available`, which is what a zone that has just
  accepted a level change should report. Nothing here has seen a zone
  reported unavailable.
enum:
  - Available
  - Unavailable
  - Unknown
