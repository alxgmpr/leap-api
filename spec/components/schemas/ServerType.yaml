type: string
description: |
  Server's role/protocol, and the discriminator for which `*Properties`
  object is populated on the same `Server` -- see `Server.yaml`.

  The firmware extraction did not recover the members; all three below were
  recovered from `Server.Type` on hardware, via /server. Unlisted values are
  possible.

  - `LEAP` -- RA3 (v03.247 and v03.249) and Caseta (v01.123 and v01.124), in
    all five corpora that reach /server. Carries
    `LEAPProperties`; TCP 8081, the transport this specification describes.
  - `IPL` -- RA3 only, in both RA3 corpora. Carries `IPLProperties`
    (`SystemNumber`/`SystemAddress`/`ProcessorID`) on TLS 8902 and WSS 443:
    the Lutron Designer transport `docs/protocol.md` covers.
  - `LIP` -- Caseta only, added here from the Caseta coverage-blind spec
    probe (`fixtures/spec-read-caseta.json`), which reached a second
    `/server` entry the earlier Caseta capture did not. Carries
    `LIPProperties` (an `Ids` reference to /server/2/id) on TCP 23: the
    plain-telnet Lutron Integration Protocol, a different protocol from
    RA3's `IPL` despite the transposed initials.

  **Appended, not reopened.** A closed enum falsified by a later corpus is
  exactly the shape of the `ServiceType` case, which was resolved the other
  way -- reopened to a documented `string` rather than extended -- so the
  divergence needs stating. The two fell the same way, from the same
  standing: this file declared `LEAP` and `IPL` with both independently
  observed on RA3 v03.247, `ServiceType` declared 8 with all 8 independently
  observed, and each was contradicted by a later corpus. Every declared
  member having been observed says nothing about whether an undeclared one
  exists, so it cannot be what separates them.

  **What separates them is that the firmware models this field with a named
  type and does not model `Service.Type` with one at all** -- the split
  `OccupancyStatus.yaml` records in full. `Server.Type` is
  `leapobj.ServerType`. A closed set exists in the firmware; this project
  simply cannot enumerate it, because the extraction recovers Go `struct`
  definitions only and never emitted a `type X string` plus consts. So each
  newly observed value converges on a real set, and `LIP` was a member to
  add. `leapobj.Service` is `Type string` beside `Body json.RawMessage` --
  no named type, nothing to converge on -- so appending there would only
  re-arm the same failure. `ProgrammingModelType` was extended on this same
  ground, and this specification has done it four times in all: three
  extensions and one reopen.

  **That ground decides only the falsification question**, and this file
  used to state it as though it decided more. It does not say whether a
  closed `enum` should ship at all: every one of the 24 closed enums here is
  a named `leapobj.*` type the extraction never defined, and so were all
  five of the fields this specification opened for having one observed value
  and no member list from anywhere else. What puts this field with the other
  22 closed enums whose every member the fixtures carry is that all three
  members above are independently observed -- not its typing.

  Extending also claims nothing about completeness. The `*Properties`
  evidence is worth keeping at its true weight: `leapobj.Server` carrying
  `LEAPProperties`, `IPLProperties` and `LIPProperties` as three distinct
  pointer fields said a third member **existed** while only the platform
  exposing it was missing from the corpus. That is real, and more than the
  opened five ever had, and more than `ProgrammingModelType` had. It does
  not say that only three exist, and nothing in the extraction could: this
  stays a lower bound, like every closed enum here.
enum:
  - LEAP
  - IPL
  - LIP
