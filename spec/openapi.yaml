openapi: 3.1.0
info:
  title: Lutron LEAP API
  version: "0.1.0"
  summary: Unofficial reference for the Lutron Extensible Application Protocol.
  license:
    name: CC BY 4.0 (documentation only -- unofficial, not endorsed by or
      affiliated with Lutron Electronics)
    identifier: CC-BY-4.0
  description: |
    LEAP is **not HTTP**. It is newline-delimited JSON over a single persistent
    mutual-TLS socket on port 8081. Each message is an envelope:

    ```json
    {
      "CommuniqueType": "ReadRequest",
      "Header": { "Url": "/zone/1/status", "ClientTag": "1" },
      "Body": {}
    }
    ```

    Responses echo `ClientTag` and carry `Header.StatusCode`, which uses
    HTTP-style strings such as `200 OK` and `400 BadRequest`. That deliberate
    resemblance is what makes an OpenAPI description a close fit.

    **`Body` is a wrapper, not the payload.** `Body` always contains exactly
    one key, named by `Header.MessageBodyType`, whose value is the actual
    payload — e.g. a `ZoneStatus` response body is
    `{"ZoneStatus": {"href": "/zone/518/status", "Level": 100, ...}}`, not
    `{"href": "/zone/518/status", "Level": 100, ...}` directly. **Every
    schema in this document describes the unwrapped payload** (the value
    under that one key), not the wrapper around it. This holds for 438 of
    the 439 `200 OK` bodies captured for this project (the one exception,
    RA3's `GET /button`, returns a bare `{}` with nothing to wrap). A client
    that treats `Body` itself as the payload will fail on every response.
    See the protocol and mapping docs (linked below) for the full account.

    This document maps LEAP onto OpenAPI as follows:

    | LEAP | OpenAPI |
    | --- | --- |
    | `Header.Url` | path |
    | `ReadRequest` | `get` |
    | `CreateRequest` | `post` |
    | `UpdateRequest` | `put` |
    | `DeleteRequest` | `delete` |
    | `SubscribeRequest` | `get` with `x-leap-subscribable` |
    | `Header.StatusCode` | response keys |
    | `Body` | request and response content |

    Schemas are derived from a firmware extraction of a RadioRA3 processor and
    validated against response bodies captured from live hardware.

    **Reading this document.** Content comes in two tiers. Anything marked
    `x-leap-verified: false` (on a path item, operation, or schema) is
    imported from the firmware route/type extraction as-is and has never
    been exercised on hardware; everything else is hand-refined and
    validated against captured traffic. `x-leap-platforms` on an operation
    records what each platform (RA3, Caseta) actually returned when probed.
    Every closed `enum` is a lower bound — the members observed or
    recovered, not a promise the set is complete. Where something is
    inferred rather than confirmed, the text says "not established".

    The narrative docs are published alongside this file and are required
    reading before writing a client:

    - Transport, framing, envelopes, tags, status codes:
      <https://alxgmpr.github.io/leap-api/docs/protocol.md>
    - Subscribe semantics and push frames:
      <https://alxgmpr.github.io/leap-api/docs/subscriptions.md>
    - RA3-vs-Caseta divergence:
      <https://alxgmpr.github.io/leap-api/docs/platforms.md>
    - Discovery, pairing, and mTLS certificates:
      <https://alxgmpr.github.io/leap-api/docs/discovery.md>
    - How LEAP was mapped onto OpenAPI and how this spec was derived:
      <https://alxgmpr.github.io/leap-api/docs/mapping.md>

    Not an official Lutron document.
servers:
  - url: leaps://{host}:8081
    description: >-
      Processor or bridge. The scheme is deliberately not http — see
      https://alxgmpr.github.io/leap-api/docs/protocol.md for the real
      transport.
    variables:
      host:
        default: 192.168.1.10
        description: Processor IP address or hostname.
tags: []
paths: {}
components:
  schemas: {}
