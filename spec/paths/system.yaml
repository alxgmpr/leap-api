/system/loadshedding/status:
  # HAND-AUTHORED (probe-derived): entirely absent from
  # _generated/system.yaml (the mangled form, `/systemloadsheddingstatus`,
  # lives in spec/paths/_generated/systemloadsheddingstatus.yaml -- that
  # generated form DID recover a response type via its own route-table
  # entry, `SystemLoadSheddingStatus`, which corroborates the schema used
  # here). Confirmed 200 OK with body key `SystemLoadSheddingStatus` on RA3
  # v03.247; Caseta v01.123 returns 405 MethodNotAllowed for the same route
  # -- a genuine platform divergence (RA3 supports load shedding, Caseta
  # does not), not a route failure. This is a singleton resource, not a
  # collection: the wire body's `SystemLoadSheddingStatus` key wraps a
  # single object, not an array (unlike the other six hand-authored paths
  # in this family group).
  get:
    operationId: getSystemLoadSheddingStatus
    tags:
      - system
    x-leap-communique-type: ReadRequest
    x-leap-body-type: SystemLoadSheddingStatus
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLoadSheddingStatus"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/SystemLoadSheddingStatus"
    summary: Get system load shedding status
