# Refined from spec/paths/_generated/system.yaml. Deviations from a
# straight copy:
#
# 1. /system/away, /system/loadshedding/status,
#    /system/naturallightoptimization, and
#    /system/naturallightoptimization/status are HAND-AUTHORED, not copied.
#    All four respond on real hardware but the firmware route-table
#    extraction mangles them: /system/away is recorded concatenated as the
#    entirely separate `/systemaway` family (spec/paths/_generated/
#    systemaway.yaml), and the other three have no entry anywhere in the
#    generated corpus at all. Captured traffic is authoritative for all
#    four (see each path's inline comment for platform-specific status
#    codes).
#
# 2. /system/action is DELIBERATELY OMITTED, not hand-authored, even though
#    it is one of the seven probe-derived paths this task was instructed to
#    hand-author. Caseta v01.123 confirms 200 OK with body key `Actions`
#    (RA3 v03.247 returns 400 BadRequest for the same route). Rendering it
#    would require the `Action` schema, whose `Statements[].Do` field
#    (`DoStmt`) `$ref`s `Command` -- the 57-property, 105-schema-closure
#    type Task 10 and Task 12a both explicitly declined to copy, and which
#    this task's instructions (established item 6) say to stop and ask
#    about rather than pull in unilaterally. Leaving /system/action out of
#    this file means it stays an honest `probedNotInSpec` gap (reported by
#    `npm run coverage`) rather than a silently-dropped or falsely-modeled
#    path. See the Task 12b report's "Blocked" section.
/system:
  get:
    operationId: getSystem
    tags:
      - system
    x-leap-communique-type: ReadRequest
    x-leap-body-type: System
    responses:
