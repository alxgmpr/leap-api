        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/System"
    summary: Get system info
  put:
    operationId: updateSystem
    tags:
      - system
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: System
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/System"
    summary: Update system settings
/system/away:
