      description: |
        Control station identifier. Accepts either the numeric integration
        id (e.g. `1494`) or the resource XID string. Merged from the
        generated `controlstationId` and `controlstationXid` route
        variants, which are the same resource addressed two ways.
      schema:
        type: string
