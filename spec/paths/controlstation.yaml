# Refined from _generated/controlstation.yaml. One deviation from a
# straight copy:
#
# /controlstation/{controlstationId} and /controlstation/{controlstationXid}
# merged into one path keyed by the `Id` form. OpenAPI forbids two paths
# differing only in parameter name (redocly's `no-identical-paths`); same
# treatment Task 10 gave /zone/{zoneId}/{zoneXid}. Kept the `{controlstationId}`
# variant's operations (delete, get, put) since it's the superset -- the
# `{controlstationXid}` variant only had a `get`, identical in body/response
# shape to the id variant's `get`. The path parameter documents that it
# accepts either form.
#
# (Task 8 update) Direct fixture coverage for GET /controlstation/{id} now
# exists: fixtures/sweep-read.json probed it on a single, previously-unseen
# processor (7 concrete instances, all XID/Name/AssociatedArea/SortOrder/
# AssociatedGangedDevices present, all validated against ControlStation.yaml
# in test/conformance.test.ts's "sweep-read" block). Before Task 8, no
# fixture covered any /controlstation/{id} route directly -- `ControlStation`
# objects were only observed nested inside
# /area/{areaId}/associatedcontrolstation's `ControlStations` array (a
# different family's file -- see ControlStation.yaml for the fixture
# evidence that originally justified its `required` list, unchanged by this
# update). The bare /controlstation collection route remains unprobed by
# this project either way -- only the per-id GET gained coverage.
/controlstation:
  post:
    operationId: createControlStation
    tags:
      - controlstation
    x-leap-communique-type: CreateRequest
    x-leap-body-type: ControlStation
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlStation"
    summary: Create control station
/controlstation/{controlstationId}:
  delete:
    operationId: deleteControlStationID
    tags:
      - controlstation
    x-leap-communique-type: DeleteRequest
    x-leap-body-type: ControlStation
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlStation"
    summary: Delete control station
  get:
    operationId: getControlStationID
    tags:
      - controlstation
    x-leap-communique-type: ReadRequest
    x-leap-body-type: ControlStation
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlStation"
    summary: Read control station
  put:
    operationId: updateControlStationID
    tags:
      - controlstation
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: ControlStation
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlStation"
    summary: Update control station
  parameters:
    - name: controlstationId
      in: path
      required: true
      description: |
        Control station identifier. Accepts either the numeric integration
        id (e.g. `1494`) or the resource XID string. Merged from the
        generated `controlstationId` and `controlstationXid` route
        variants, which are the same resource addressed two ways.
      schema:
        type: string
/controlstation/{controlstationId}/device/ledstatus:
