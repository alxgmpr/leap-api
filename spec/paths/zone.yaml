# Refined from spec/paths/_generated/zone.yaml. Deviations from a straight
# copy, all decided and recorded in the Task 10 report:
#
# 1. GET /zone: x-leap-body-type and the 200 schema were changed from `Zone`
#    (singular) to `Zones` (array). The firmware extraction mislabeled the
#    collection route's MessageBodyType; captured Caseta v01.123 traffic
#    (RA3 returns 405 on the bare collection route, so unconfirmed there)
#    shows the wire body is `{"Zones": [...]}`.
#
# 2. /zone/status and /zone/{zoneId}/status/expanded are HAND-AUTHORED, not
#    copied. Both are absent from _generated/zone.yaml: the route-table
#    extraction records collection paths concatenated (would need
#    `/zonestatus`) and reorders the expanded-status segments (the firmware
#    table has `/zone/{id}/expanded/status`). Captured traffic (RA3 v03.247,
#    Caseta v01.123, both 200 OK) is authoritative for both -- the mangled
#    generated forms (`/zone/{zoneId}/expanded/status`, and the entirely
#    absent `/zone/status`) are excluded from this file so they never reach
#    the bundle.
#
# 3. /zone/{zoneId} and /zone/{zoneXid} (and their /associatedloadcontroller
#    children) are MERGED. OpenAPI forbids two paths differing only in
#    parameter name (redocly's no-identical-paths); in LEAP a zone is
#    addressable by either its numeric integration id or its XID string, so
#    dropping one silently would lose a real access path. Each pair is
#    merged into one `/zone/{zoneId}` path whose parameter description
#    documents both accepted forms, keeping the union of operations (the
#    `{zoneId}` variant carried richer metadata -- subscribability, event
#    schema, summary -- than its `{zoneXid}` counterpart for the same
#    operation, so that is the definition kept).
#
# 4. (Task 8) /zone/{zoneId}/associatedloadcontroller's TODO(response) is
#    resolved: Task 8's sweep fixtures (`fixtures/sweep-read.json`, 8
#    probe-confirmed zones) confirm a 200 OK body keyed `LoadControllers`, a
#    hand-authored collection wrapper (see LoadControllers.yaml) -- the
#    firmware-extracted route table recovered no responseType for this
#    operation at all, so this is a gap fill, not a singular/plural
#    correction like deviation 1 above.
/zone:
  get:
    operationId: getZone
    tags:
      - zone
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Zones
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zones"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/Zone"
    summary: List all zones
/zone/status:
  # HAND-AUTHORED (probe-derived): absent from _generated/zone.yaml. The
  # firmware route-table extraction records collection paths concatenated
  # (e.g. it would need a literal `/zonestatus` segment); the real wire URL
  # is `/zone/status`. Confirmed 200 OK with body key `ZoneStatuses` on both
  # RA3 v03.247 and Caseta v01.123.
  get:
    operationId: getZoneStatus
    tags:
      - zone
    x-leap-communique-type: ReadRequest
    x-leap-body-type: ZoneStatuses
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneStatuses"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/ZoneStatus"
    summary: List all zone statuses
