    summary: Read zone
  put:
    operationId: updateZoneID
    tags:
      - zone
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: Zone
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zone"
    summary: Update zone
  parameters:
    - name: zoneId
      in: path
      required: true
      description: |
        Zone identifier. Accepts either the numeric integration id (e.g.
        `518`) or the resource XID string (e.g.
        `AbCdEfGhIjKlMnOpQrStUv`). Merged from the generated `zoneId` and
        `zoneXid` route variants, which are the same resource addressed two
        ways.
      schema:
        type: string
