# HAND-AUTHORED end to end. The firmware route-table extraction has zero
# commandprocessor routes at all, in any verb (`grep` for "command" across
# all 410 returns nothing) -- this is narrower than "the extraction is
# read-only in general": it isn't (51 CREATE, 90 UPDATE, 44 DELETE verbs
# are recovered elsewhere in vendor/leap-routes.json, mapped throughout
# this specification by lib/route-to-path.ts -- see docs/mapping.md). The
# gap is specific to command processors. Every path in this file, and the
# `Command` schema (and its 106-schema transitive closure, copied unmodified
# from `_generated/`) it references, comes from app reverse engineering
# rather than the firmware extraction. Both sources below live in the
# separate `lutron-protocols` repository this project was built against,
# under `docs/protocols/leap/`, not in this repository:
#
#   - api-discovery.md (`lutron-protocols` docs/protocols/leap/api-discovery.md)
#     -- decompiled from the Android APK, com.lutron.lsb v26.1.0.4 (jadx).
#     This has explicit "CommandType | Parameters | Description" tables for
#     several command families.
#   - index.md (`lutron-protocols` docs/protocols/leap/index.md), "Route
#     Reference (from iOS App Binary RE)" section -- decompiled from Lutron
#     iOS app v26.0.0 (com.lutron.lsb, build 8).
#
# No captured traffic exists for any of these ten paths (the fixtures were
# gathered by probing read-only ReadRequest/Subscribe routes; a CreateRequest
# that actually executes a command was never sent during probing). That
# means these paths are permanently a `specWithoutFixture` entry in
# `npm run coverage`, by design -- not a gap to chase. One of the ten,
# `/virtualbutton/{virtualbuttonId}/commandprocessor`, is corroborated more
# strongly than the rest even so: it is not just app-RE, it is the literal
# `href` of a `Resource` named inside a captured 200 response body
# (`fixtures/caseta.json`, `/system/action`) -- see that path's own comment
# below.
#
# Every operation shares the same shape: `x-leap-communique-type:
# CreateRequest`, a requestBody of `$ref: Command`, and no confirmed 200
# response schema (no source -- app RE or captured traffic -- documents
# what a command processor's CreateResponse body looks like, so none is
# asserted here rather than invented).
#
# See Command.yaml's description for the full CommandType-to-parameter-field
# table and its source citations, and CommandType.yaml for why several
# app-RE-mentioned names were deliberately excluded from the enum.
/zone/{zoneId}/commandprocessor:
  post:
    operationId: createZoneIDCommandProcessor
    tags:
      - zone
    x-leap-communique-type: CreateRequest
    description: |
      Send a command to a zone. Confirmed accepted CommandTypes
      (api-discovery.md, `lutron-protocols` docs/protocols/leap/api-discovery.md,
      Zone Commands table, Android APK RE): `GoToDimmedLevel`,
      `GoToSwitchedLevel`, `GoToShadeLevel`, `GoToShadeLevelWithTilt`,
      `GoToShadeLevelWithTiltWhenClosed`, `GoToTilt`, `GoToSpectrumTuningLevel`,
      `GoToWhiteTuningLevel`, `GoToWarmDim`, `GoToMixedLevel`, `Raise`,
      `Lower`, `Stop`.

      The same source's "Command Surfaces" section also lists this endpoint's
      accepted body-wrapper classes as including `ZoneControlCommandBody`,
      `CommandTuningSettingsBody`, `EnterShadeLimitSetModeCommandBody`,
      `ExitShadeLimitSetModeCommandBody`, `ShadeLimitLowerLiftCommandBody`,
      `ShadeLimitRaiseLiftCommandBody`, `ShadeLimitSaveClosedLiftCommandBody`,
      `ShadeLimitSaveOpenLiftCommandBody`, `TestCloseLimitCommandBody`,
      `TestOpenLimitCommandBody` -- confirming the zone processor also does
      shade-limit calibration and tuning, but the literal CommandType wire
      strings for those are not established (see `CommandType.yaml`).

      index.md's iOS-RE "Zone Commands" section additionally names
      `GoToFanSpeed`, `GoToBrightnessLevel`, `GoToVibrancyLevel`,
      `EnableAutoVibrancy`, `GoToCurveDimming`, `GoToNaturalShow`, and
      `StopIfMoving` as zone commands, and describes (without giving a clean
      literal string) CCO and receptacle level commands -- not established
      as confirmed wire values; see `CommandType.yaml` for why.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Command"
    responses:
      "200":
        description: Success
    summary: Send zone command
  parameters:
    - name: zoneId
      in: path
      required: true
      description: |
        Zone identifier. Accepts either the numeric integration id or the
        resource XID string -- see `/zone/{zoneId}` in zone.yaml.
      schema:
        type: string
