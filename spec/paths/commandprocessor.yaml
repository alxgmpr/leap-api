/virtualbutton/{virtualbuttonId}/commandprocessor:
  post:
    operationId: createVirtualButtonIDCommandProcessor
    tags:
      - virtualbutton
    x-leap-communique-type: CreateRequest
    description: |
      Fire a virtual button (press-and-release), the mechanism Caseta uses to
      trigger a scene. Confirmed CommandType: `PressAndRelease` (also
      confirmed for `/system/action`'s System Actions -- see
      `CommandType.yaml`).

      Unlike the other nine `commandprocessor` paths in this file, this one
      is not purely app-RE: a captured Caseta v01.123 response
      (`fixtures/caseta.json`, `GET /system/action`) names this exact path
      as the `href` of a `Command`-type `Statement.Do.Resource`, wrapping a
      `Command` with `CommandType: "PressAndRelease"` and no other fields --
      confirming both the path and that this CommandType takes no
      parameters. No response body from the command processor itself was
      captured (the fixture is `/system/action`'s own body, which merely
      references this path; probing never sent a CreateRequest here), so
      the same "no asserted 200 schema" rule applies as the other nine.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Command"
    responses:
      "200":
        description: Success
    summary: Send virtual button command
  parameters:
    - name: virtualbuttonId
      in: path
      required: true
      schema:
        type: string
