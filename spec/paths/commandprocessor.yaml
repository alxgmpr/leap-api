/database/commandprocessor:
  post:
    operationId: createDatabaseCommandProcessor
    tags:
      - database
    x-leap-communique-type: CreateRequest
    description: |
      Send a database command. Confirmed accepted CommandTypes
      (api-discovery.md Other Command Endpoints table + the "ApplyDatabaseCommand"
      and "BeginTransferSessionCommand" sections, Android APK RE): `ApplyNow`
      (populates `ApplyNowParameters`, which in turn carries
      `EndDeviceTransferParameters` -- triggers immediate application of
      programming changes) and `BeginTransferSession` (populates
      `BeginTransferSessionParameters`, polymorphic: a `Download` variant
      with a `DownloadFrom` model, or a `FilePackage` variant with a
      `FilePackageDestination` model).

      Path note: api-discovery.md's own "Other Command Endpoints" table
      gives this route as `/database/{id}/commandprocessor` (parameterized),
      while index.md's "Command Processor Endpoints" table gives it as
      `/database/commandprocessor` (bare) -- the two app-RE sources
      disagree. This task's brief specifies the bare form; that is what is
      written here.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Command"
    responses:
      "200":
        description: Success
    summary: Send database command
