# Refined from spec/paths/_generated/area.yaml. One deviation from a
# straight copy, decided and recorded per the Task 10 precedent
# (spec/paths/zone.yaml):
#
# /area/{areaId} and /area/{areaXid} are MERGED. OpenAPI forbids two paths
# differing only in parameter name (redocly's no-identical-paths); in LEAP
# an area is addressable by either its numeric integration id or its XID
# string, so dropping one silently would lose a real access path. Merged
# into one `/area/{areaId}` path whose parameter description documents both
# accepted forms, keeping the union of operations (the `{areaId}` variant
# carried a `put` and subscribability/event-schema/summary that the
# `{areaXid}` variant lacked for the shared `get` operation, so that is the
# definition kept).
/area:
  post:
    operationId: createArea
    tags:
      - area
    x-leap-communique-type: CreateRequest
    x-leap-body-type: Area
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Area"
    summary: Create area
  x-leap-subscribable: true
  x-leap-event-schema:
    $ref: "#/components/schemas/Area"
/area/daylightinggainsettings:
  get:
    operationId: getAreaDaylightingGainSettings
    tags:
      - area
    x-leap-communique-type: ReadRequest
    description: "TODO(response): no responseType recovered from the firmware extraction"
    responses:
      "200":
        description: Success
/area/{areaId}:
  get:
    operationId: getAreaID
    tags:
      - area
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Area
    responses:
