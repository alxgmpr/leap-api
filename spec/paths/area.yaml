            schema:
              $ref: "#/components/schemas/Area"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/Area"
    summary: Read area
  put:
    operationId: updateAreaID
    tags:
      - area
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: Area
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Area"
    summary: Update area
  parameters:
    - name: areaId
      in: path
      required: true
      description: |
        Area identifier. Accepts either the numeric integration id (e.g.
        `1304`) or the resource XID string. Merged from the generated
        `areaId` and `areaXid` route variants, which are the same resource
        addressed two ways.
      schema:
        type: string
