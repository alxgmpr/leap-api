# Refined from spec/paths/_generated/area.yaml. Four deviations from a
# straight copy:
#
# 1. /area/{areaId} and /area/{areaXid} are MERGED, decided and recorded per
#    the Task 10 precedent (spec/paths/zone.yaml). OpenAPI forbids two paths
#    differing only in parameter name (redocly's no-identical-paths); in
#    LEAP an area is addressable by either its numeric integration id or its
#    XID string, so dropping one silently would lose a real access path.
#    Merged into one `/area/{areaId}` path whose parameter description
#    documents both accepted forms, keeping the union of operations (the
#    `{areaId}` variant carried a `put` and subscribability/event-schema/
#    summary that the `{areaXid}` variant lacked for the shared `get`
#    operation, so that is the definition kept).
#
# 2. GET /area was HAND-AUTHORED and added -- absent from the generated
#    corpus because vendor/leap-routes.json records `/area`'s verbs as only
#    CREATE+SUBSCRIBE, no GET. Captured traffic on both RA3 and Caseta shows
#    `GET /area` returns `200 OK` with a real body (`{"Areas": [...]}`) --
#    see Areas.yaml. docs/platforms.md tells RA3 readers to start device
#    discovery by enumerating `/area`; without this operation that
#    documented starting point did not exist in the spec. `x-leap-
#    subscribable`/`x-leap-event-schema` moved from the path item onto this
#    `get` operation to match the convention used for every other bare
#    collection route with a GET (`/device`, `/zone`, `/virtualbutton`).
#    `/area` was previously the one no-GET exception to that convention;
#    that carve-out no longer applies.
#
# 3. The six area-settings operations -- `/area/{daylightinggainsettings,
#    occupancysensorsettings,occupancysettings}`, each as a collection route
#    and a per-area route -- had their `TODO(response)` resolved. The
#    firmware route table records no responseType for any of the six, so
#    each is a gap fill, not a singular/plural correction. All six 200 OK
#    bodies come from one corpus, `fixtures/spec-read-caseta.json` (Caseta
#    v01.123), and behind them stand only three objects: the
#    daylighting-gain, occupancy-sensor and occupancy settings of `/area/2`,
#    each returned twice -- once bare through its per-area route, once as the
#    single element of its collection route's array. The collection and
#    per-area routes share a MessageBodyType and differ only in that array
#    wrapper, which is why the three collection schemas carry a `Collection`
#    suffix the wire does not supply -- see
#    DaylightingGainSettingsCollection.yaml. RA3 v03.249 answers all three
#    collection routes `204 NoContent` and all 24 per-area requests `404
#    NotFound`, so RA3 contributes no body to any of the six.
#
# 4. Four more `TODO(response)`s resolved, the area-misc family:
#    `/area/{areaId}/areascene`, `/area/{areaId}/associatedzone/status`, its
#    `/expanded` sibling, and `/area/{areaId}/childarea/summary`. Same gap-fill
#    shape as deviation 3 -- all four are in the firmware route table with
#    `responseType: null` -- but the evidence runs the other way round: three
#    of the four are answered only by RA3 v03.249, and only
#    `/childarea/summary` gets a body from both platforms. Two of the four
#    reuse existing schemas (`ZoneStatuses`, and `ZoneExpandedStatus` as the
#    element of a new `ZoneExpandedStatuses` wrapper); `AreaSummaries` wraps
#    the already-refined `AreaSummary`; only `AreaScene` is a new element
#    type, copied verbatim from the generated file because all 38 observed
#    instances agree with it.
#
# 5. Four routes settled by the in-doubt sweep (2026-08-31, read-only, RA3
#    v03.249, fixtures/spec-read-indoubt.json), which probed each of the 51
#    concatenation-suspect firmware routes in both spellings: `/area/status`
#    and `/areascene/{areasceneId}` with 200 bodies, `/area/loadshedding`
#    and `/area/relation` proven to exist by 204s. Each entry at the bottom
#    of this file records its own verdict.
/area:
  get:
    operationId: getArea
    tags:
      - area
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Area
    description: >-
      `x-leap-body-type` is `Area` (singular) because that is the only
      responseType the firmware ever associated with the `Area` identifier --
      the extraction recorded no GET route for `/area` at all (CREATE and
      SUBSCRIBE only). Captured traffic shows the real response is a `Areas`
      array; see `Areas.yaml`.
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Areas"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/Area"
    summary: List all areas
  post:
    operationId: createArea
    tags:
      - area
    x-leap-communique-type: CreateRequest
    x-leap-body-type: Area
    responses:
      "200":
        description: Success
