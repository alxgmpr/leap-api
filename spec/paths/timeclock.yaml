# Refined from _generated/timeclock.yaml. Two HAND-AUTHORED paths added,
# not present in the generated corpus at all (the extraction never
# recovered a bare `/timeclock` collection route in any form, mangled or
# otherwise):
#
# - /timeclock: body key `Timeclocks`. 200 OK on both platforms.
# - /timeclock/status: body key `TimeclockStatuses`. The extraction instead
#   produced a mangled `/timeclockstatus` family (see
#   _generated/timeclockstatus.yaml, left in staging) -- captured traffic
#   confirms the real wire URL uses a slash. 200 OK on RA3 v03.247; 204
#   NoContent on Caseta v01.123.
#
# Both are probe-derived per this task's instructions; captured traffic is
# authoritative.
