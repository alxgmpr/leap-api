/emergency:
  get:
    operationId: getEmergency
    tags:
      - emergency
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Emergency
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Emergency"
    summary: List emergency configs
/emergency/{emergencyId}:
  get:
    operationId: getEmergencyID
    tags:
      - emergency
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Emergency
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Emergency"
    summary: Read emergency config
  put:
    operationId: updateEmergencyID
    tags:
      - emergency
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: Emergency
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Emergency"
    summary: Update emergency
  parameters:
    - name: emergencyId
      in: path
      required: true
      schema:
        type: string
