/detectiongroup/{detectiongroupId}:
  delete:
    operationId: deleteDetectionGroupID
    tags:
      - detectiongroup
    x-leap-communique-type: DeleteRequest
    x-leap-body-type: DetectionGroup
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionGroup"
    summary: Delete detection group
  get:
    operationId: getDetectionGroupID
    tags:
      - detectiongroup
    x-leap-communique-type: ReadRequest
    x-leap-body-type: DetectionGroup
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionGroup"
    summary: Read detection group (camera)
  put:
    operationId: updateDetectionGroupID
    tags:
      - detectiongroup
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: DetectionGroup
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionGroup"
    summary: Update detection group
  parameters:
    - name: detectiongroupId
      in: path
      required: true
      schema:
        type: string
