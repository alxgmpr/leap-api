    operationId: getDaylightSensorIDStatus
    tags:
      - daylightsensor
    x-leap-communique-type: ReadRequest
    x-leap-body-type: DaylightSensorStatus
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaylightSensorStatus"
    summary: Get daylight sensor status
  parameters:
    - name: daylightsensorId
      in: path
      required: true
      schema:
        type: string
