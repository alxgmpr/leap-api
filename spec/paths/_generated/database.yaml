/database/{databaseId}:
  get:
    operationId: getDatabaseID
    tags:
      - database
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Database
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Database"
    summary: Read database info
  parameters:
    - name: databaseId
      in: path
      required: true
      schema:
        type: string
/database/{databaseId}/databasetransfersession:
