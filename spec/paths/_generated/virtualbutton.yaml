    operationId: getVirtualButtonID
    tags:
      - virtualbutton
    x-leap-communique-type: ReadRequest
    x-leap-body-type: VirtualButton
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualButton"
    summary: Read virtual button
  put:
    operationId: updateVirtualButtonID
    tags:
      - virtualbutton
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: VirtualButton
    responses:
      "200":
