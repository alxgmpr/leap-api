# Refined from _generated/programmingmodel.yaml. One deviation from a
# straight copy:
#
# GET /programmingmodel: x-leap-body-type and the 200 schema were changed
# from `ProgrammingModel` (singular) to `ProgrammingModels` (a new array
# schema). Same class of extraction mislabel Task 10 found for GET /zone.
# Caseta v01.123's actual 200 response is `{"ProgrammingModels": [...]}`.
# RA3 v03.247 returns 204 NoContent on this route.
#
# /programmingmodel/{programmingmodelId}/preset has no fixture coverage in
# either platform's probe corpus, so it stays TODO(response), unchanged.
/programmingmodel:
  get:
    operationId: getProgrammingModel
    tags:
      - programmingmodel
    x-leap-communique-type: ReadRequest
    x-leap-body-type: ProgrammingModels
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammingModels"
    summary: List programming models
/programmingmodel/{programmingmodelId}:
  get:
    operationId: getProgrammingModelID
    tags:
      - programmingmodel
    x-leap-communique-type: ReadRequest
    x-leap-body-type: ProgrammingModel
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammingModel"
    summary: Read programming model
  parameters:
    - name: programmingmodelId
      in: path
      required: true
      schema:
        type: string
/programmingmodel/{programmingmodelId}/preset:
  get:
    operationId: getProgrammingModelIDPreset
    tags:
      - programmingmodel
    x-leap-communique-type: ReadRequest
    description: "TODO(response): no responseType recovered from the firmware extraction"
    responses:
      "200":
        description: Success
    summary: List presets for programming model
  parameters:
    - name: programmingmodelId
      in: path
      required: true
      schema:
        type: string
