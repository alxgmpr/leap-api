# Refined from spec/paths/_generated/server.yaml. Two deviations from a
# straight copy:
#
# 1. /server is HAND-AUTHORED, not copied. It responds on real hardware but is
# entirely absent from the generated corpus -- the route-table extraction
# only recovered /server's sub-routes (/server/ipl, /server/leap/*,
# /server/status/ping), never the bare collection route itself. Captured
# traffic is authoritative: confirmed 200 OK with body key `Servers` on
# both RA3 v03.247 and Caseta v01.123.
#
# 2. GET /server/ipl and GET /server/status/ping had their markers resolved,
#    two different kinds of resolution. /server/ipl needed no new schema: its
#    body is byte-identical to an element the already-refined `Servers`
#    collection returns, so it points at `Server`. /server/status/ping needed
#    a new one, PingResponse, named for the wire body key rather than for the
#    `leapobj.Ping` struct it was refined from -- the route table connects
#    neither, recording `responseType: null`.
#
#    The remaining five markers in this file are untouched, and the reason
#    differs per marker. Every probe in this project sends only ReadRequests,
#    so the three states are "read and refused", "never requested", and "the
#    path was read but the marked operation is not a read":
#
#      - `getServerLEAPIntegratorPairing` (GET /server/leap/integrator/pairing)
#        was asked and refused: `400 BadRequest`, body `{"Message": "This
#        request is not supported"}`, on both spec probes. A genuine read
#        refusal, and the only one of the five.
#      - `getServerLEAPPairingID` and `updateServerLEAPPairingID`
#        (/server/leap/pairing/{id}) were never requested by any corpus.
#      - `createServerLEAPPairing` (POST /server/leap/pairing) has had only
#        ReadRequests sent to its path -- that path carries no `get` here, so
#        the `400` the probes got is a read of a create-only route and says
#        nothing about what a `CreateRequest` would return. Same standard as
#        the fifth marker, the `put` on /server/ipl: a `get`'s response is not
#        evidence for another verb on the same path (spec/paths/zone.yaml
#        states the rule).
/server:
  get:
    operationId: getServer
    tags:
      - server
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Servers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Servers"
    summary: List servers
/server/ipl:
  get:
    operationId: getServerIPL
    tags:
      - server
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Server
    description: >-
      No responseType recovered from the firmware extraction. Captured
      traffic resolves it: RA3 v03.249 returns `200 OK` with body key
      `Server` holding a single Server object -- byte-identical to the
      `Type: "IPL"` entry the same corpus lists inside `GET /server`, so the
      existing `Server` schema already described it. Caseta v01.123 returns
      `405 MethodNotAllowed` and has no IPL server in its `/server` list
      either. The `put` keeps its marker: no `UpdateRequest` was ever sent
      here.
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Server"
    summary: Read the IPL server
  put:
    operationId: updateServerIPL
    tags:
      - server
    x-leap-communique-type: UpdateRequest
    description: "TODO(response): no responseType recovered from the firmware extraction"
    responses:
      "200":
        description: Success
/server/leap/integrator/pairing:
  get:
    operationId: getServerLEAPIntegratorPairing
    tags:
      - server
    x-leap-communique-type: ReadRequest
    description: "TODO(response): no responseType recovered from the firmware extraction"
    responses:
      "200":
        description: Success
/server/leap/pairing:
  post:
    operationId: createServerLEAPPairing
    tags:
      - server
    x-leap-communique-type: CreateRequest
    description: "TODO(response): no responseType recovered from the firmware extraction"
    responses:
      "200":
        description: Success
    summary: Create LEAP pairing
/server/leap/pairing/{pairingId}:
  get:
    operationId: getServerLEAPPairingID
    tags:
      - server
    x-leap-communique-type: ReadRequest
    description: "TODO(response): no responseType recovered from the firmware extraction"
    responses:
      "200":
        description: Success
    summary: Read pairing
  put:
    operationId: updateServerLEAPPairingID
    tags:
      - server
    x-leap-communique-type: UpdateRequest
    description: "TODO(response): no responseType recovered from the firmware extraction"
    responses:
      "200":
        description: Success
    summary: Update pairing
  parameters:
    - name: pairingId
      in: path
      required: true
      schema:
        type: string
/server/status/ping:
  get:
    operationId: getServerStatusPing
    tags:
      - server
    x-leap-communique-type: ReadRequest
    x-leap-body-type: PingResponse
    description: >-
      No responseType recovered from the firmware extraction. Captured
      traffic resolves it: both platforms return `200 OK` with body key
      `PingResponse` -- `{"LEAPVersion": 3.249}` on RA3 v03.249,
      `{"LEAPVersion": 1.123}` on Caseta v01.123. The body key is
      `PingResponse` while the firmware struct is `leapobj.Ping`; see
      PingResponse.yaml, which also records that `LEAPVersion` is a JSON
      number and not the zero-padded string `Server.ProtocolVersion` uses
      for the same build.
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingResponse"
    summary: Ping server status
