# Refined from spec/paths/_generated/project.yaml. One deviation from a
# straight copy:
#
# /project/contactinfo is HAND-AUTHORED, not copied. It responds on real
# hardware but is entirely absent from the generated corpus -- the closest
# generated entry is `/project/contact` (singular, no `info` suffix, no
# recovered response type), a different route. Captured traffic is
# authoritative: confirmed 200 OK with body key `Contacts` on RA3 v03.247;
# Caseta v01.123 returns 204 NoContent for the same route (no contacts
# configured at probe time, not a route failure).
/project:
  get:
    operationId: getProject
    tags:
      - project
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Project
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/Project"
    summary: Get project info
  put:
    operationId: updateProject
    tags:
      - project
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: Project
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
    summary: Update project
