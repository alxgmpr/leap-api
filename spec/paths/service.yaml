# Refined from spec/paths/_generated/service.yaml. Two deviations from a
# straight copy:
#
# 1. GET /service: x-leap-body-type and the 200 schema were changed from
#    `Service` (singular) to `Services` (a new array schema). The firmware
#    extraction mislabeled the collection route's MessageBodyType; captured
#    traffic on both RA3 v03.247 and Caseta v01.123 shows the wire body is
#    `{"Services": [...]}`. Same class of mislabel Task 10 found for GET
#    /zone and Task 12a found for GET /device and GET /link.
#
# 2. The five named per-service GETs -- /service/{alexa,bacnet,homekit,
#    ifttt,sonos} -- had their TODO markers resolved by pointing at the
#    existing `Service` schema. No new schema was authored: each returns
#    `{"Service": {...}}`, a single object byte-identical to the entry the
#    same platform lists inside `GET /service` -- checked for all 9 of the 200
#    OK bodies -- so the collection route's element type already described
#    them. These are the singular routes, so unlike
#    deviation 1 there is no plural correction involved -- the firmware
#    simply recorded no responseType for any of the five.
#
#    The 42 remaining TODO markers in this file are untouched: every other
#    /service/* route either was never probed or never returned a 200 in any
#    corpus. `/service/{serviceId}` is a separate, already-refined operation
#    and is not one of the five.
/service:
  post:
    operationId: createService
    tags:
      - service
    x-leap-communique-type: CreateRequest
    x-leap-body-type: Service
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Service"
    summary: Create service
  get:
    operationId: getService
    tags:
      - service
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Services
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Services"
    summary: List all services
/service/alexa:
  get:
    operationId: getServiceAlexa
    tags:
      - service
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Service
    description: >-
      No responseType recovered from the firmware extraction. Captured
      traffic resolves it: both platforms return `200 OK` with body key
      `Service` holding a single Service object, byte-identical to the entry
      the same platform lists inside `GET /service`. RA3 v03.249's carries
      `AlexaProperties` with both `Configuration` and `DataSummary`; Caseta
      v01.123's carries `DataSummary` only.
    responses:
      "200":
        description: Success
