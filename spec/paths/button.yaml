# Refined from _generated/button.yaml. One deviation from a straight copy:
#
# GET /button: x-leap-body-type and the 200 schema were changed from
# `Button` (singular) to `Buttons`. Same class of extraction mislabel found
# for GET /zone -- the extraction recorded getButton's MessageBodyType as
# `Button` (singular). Caseta v01.123's actual 200 response is
# `{"Buttons": [...]}` (an array). RA3 v03.247 also returns 200 OK on this
# route, but with a literal empty object `{}` -- no buttons reportable at
# probe time on that unit, a real, confirmed response, not a capture error.
# `Buttons.yaml` is a `oneOf` written specifically to accept both shapes
# (the normal array, and an object matching exactly `{}`); the RA3 `{}`
# case unwraps to no recognized key (a bare `{}` has no key to unwrap) and
# is validated as-is against that `oneOf` by test/conformance.test.ts, not
# skipped -- see that file's body-key lookup and `docs/mapping.md`'s "The
# `Body` wrapper" section.
/button:
  get:
    operationId: getButton
    tags:
      - button
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Buttons
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Buttons"
    summary: List all buttons
/button/{buttonId}:
  get:
    operationId: getButtonID
    tags:
      - button
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Button
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Button"
    summary: Read button
  put:
    operationId: updateButtonID
    tags:
      - button
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: Button
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Button"
    summary: Update button
  parameters:
    - name: buttonId
      in: path
      required: true
      schema:
        type: string
