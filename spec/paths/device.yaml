# Refined from spec/paths/_generated/device.yaml. Deviations from a
# straight copy, all decided and recorded in the Task 12a report:
#
# 1. GET /device: x-leap-body-type and the 200 schema were changed from
#    `Device` (singular) to `Devices` (a new array schema). Same class of
#    extraction mislabel Task 10 found for GET /zone -- the extraction
#    recorded the collection route's MessageBodyType as the singular item
#    type, but Caseta v01.123's actual 200 response (RA3 returns 204 on the
#    bare collection route, so unconfirmed there) is `{"Devices": [...]}`.
#
# 2. /device/status and /device/{deviceId}/buttongroup/expanded are
#    HAND-AUTHORED, not copied. `/device/status` is entirely absent from
#    _generated/device.yaml (the route-table extraction concatenates
#    collection paths, so it would need a literal `/devicestatus` segment
#    that doesn't exist in the corpus at all). `/device/{deviceId}/
#    buttongroup/expanded` IS present in _generated/device.yaml but under
#    the mangled key `/device/{deviceId}/buttongroupexpanded` (concatenated,
#    no slash) -- the real wire URL has a slash. Captured traffic is
#    authoritative for both: RA3 v03.247 and Caseta v01.123 both confirm
#    `/device/status` 200 OK (body key `DeviceStatuses`; also seen 204 on
#    RA3 and 200 on Caseta, platform-dependent) and `/device/{deviceId}/
#    buttongroup/expanded` 200 OK on RA3 (body key `ButtonGroupsExpanded`;
#    204 on both platforms for devices without button groups, 404 on RA3 for
#    a stale id). The mangled generated form
#    (`/device/{deviceId}/buttongroupexpanded`) is excluded from this file
#    so it never reaches the bundle.
#
# 3. GET /device/{deviceId}/ledsettings had its marker resolved -- a gap
#    fill, the route table records no responseType. Caseta-only evidence: 15
#    distinct LEDSettings objects across the two Caseta corpora, and `500
#    InternalServerError` from both RA3 corpora on every device id they
#    requested. Two schemas were brought in, LEDSettings verbatim and
#    LEDSpecificSettings with its `EnabledState` pointed at the shared enum
#    schema on firmware type identity.
#
# 4. GET /device/{deviceId}/linknode/{linknodeId} had its marker resolved by
#    reuse, no schema authored: the wire body key is `LinkNode` and the
#    existing schema already covered it. A gap fill; the route table records
#    no responseType. Three observed bodies, two platforms. LinkType.yaml
#    counted these three already and noted that conformance never saw them
#    -- that note is now stale and is corrected in the same commit.
/device:
  post:
    operationId: createDevice
    tags:
      - device
    x-leap-communique-type: CreateRequest
    x-leap-body-type: Device
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Device"
    summary: Create device
  get:
    operationId: getDevice
    tags:
      - device
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Devices
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Devices"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/Device"
    summary: List all devices
/device/status:
  # HAND-AUTHORED (probe-derived): absent from _generated/device.yaml. The
  # firmware route-table extraction records collection paths concatenated
  # (e.g. it would need a literal `/devicestatus` segment); the real wire
  # URL is `/device/status`. Confirmed 200 OK with body key `DeviceStatuses`
  # on Caseta v01.123; RA3 v03.247 returns 204 NoContent for the same route
  # (no devices with reportable status at probe time, not a route failure).
  get:
    operationId: getDeviceStatus
    tags:
      - device
    x-leap-communique-type: ReadRequest
    x-leap-body-type: DeviceStatuses
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStatuses"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/DeviceStatus"
    summary: List all device statuses
