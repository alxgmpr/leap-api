/device/{deviceId}/ledsettings:
  get:
    operationId: getDeviceIDLEDSettings
    tags:
      - device
    x-leap-communique-type: ReadRequest
    x-leap-body-type: LEDSettings
    description: >-
      No responseType recovered from the firmware extraction. Captured
      traffic resolves it: Caseta v01.123 returns `200 OK` with body key
      `LEDSettings` -- 14 device ids on `fixtures/caseta.json` and 1 on
      `fixtures/spec-read-caseta.json`, 15 distinct objects. Both RA3
      corpora return `500 InternalServerError` on every device id they
      requested, 32 and 8; the established "broken on RA3" finding is
      reproduced at a second firmware build, and is a statement about those
      two corpora rather than about RA3 units, whose count this repository
      does not establish. See LEDSettings.yaml.
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LEDSettings"
    summary: Get device LED settings
  parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
/device/{deviceId}/linknode/{linknodeId}:
  get:
    operationId: getDeviceIDLinkNodeID
    tags:
      - device
    x-leap-communique-type: ReadRequest
    x-leap-body-type: LinkNode
    description: >-
      No responseType recovered from the firmware extraction. Captured
      traffic resolves it: both platforms return `200 OK` with body key
      `LinkNode` holding a bare object, which the existing `LinkNode` schema
      already described. Three bodies in all -- RA3 v03.249's
      `/device/435/linknode/{438,436}` (`RF` and `ClearConnectTypeX`) and
      Caseta v01.123's `/device/3/linknode/2` (`RF`). Every other
      device/linknode id pair the spec probes tried returns `404 NotFound`;
      neither original campaign corpus nor either sweep corpus requested this
      route.
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkNode"
    summary: Get device link node
  parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
    - name: linknodeId
      in: path
      required: true
      schema:
        type: string
