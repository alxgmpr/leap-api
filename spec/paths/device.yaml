/device/{deviceId}/buttongroup:
  get:
    operationId: getDeviceIDButtonGroup
    tags:
      - device
    x-leap-communique-type: ReadRequest
    x-leap-body-type: ButtonGroups
    description: >-
      No responseType recovered from the firmware extraction. Captured
      traffic resolves it: body key `ButtonGroups` on both platforms (RA3
      v03.247: 16 of 32 probed devices return `200 OK`, the rest `204
      NoContent` or `404 NotFound` for devices with no button groups;
      Caseta v01.123: 10 of 24 probed devices return `200 OK`).
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ButtonGroups"
    summary: List button groups on device
  parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
/device/{deviceId}/buttongroup/expanded:
  # HAND-AUTHORED (probe-derived): _generated/device.yaml has this same
  # operation under `/device/{deviceId}/buttongroupexpanded` -- the firmware
  # route table concatenates the `buttongroup` and `expanded` segments
  # instead of the real wire URL's `/`. Confirmed 200 OK with body key
  # `ButtonGroupsExpanded` on RA3 v03.247 (also 204/404 on other device
  # ids, and 204 on Caseta v01.123 across all probed ids -- Caseta's
  # probed devices have no button groups, not a route failure). The wire
  # form (`buttongroup/expanded`) is used here and the mangled generated
  # path is dropped.
  get:
    operationId: getDeviceIDButtonGroupExpanded
    tags:
      - device
    x-leap-communique-type: ReadRequest
    x-leap-body-type: ButtonGroupsExpanded
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ButtonGroupsExpanded"
    summary: List expanded button groups on device
  parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
