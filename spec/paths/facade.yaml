# Refined from _generated/facade.yaml. One deviation from a straight copy:
#
# GET /facade: x-leap-body-type and the 200 schema were changed from
# `Facade` (singular) to `Facades` (a new array schema). Same class of
# extraction mislabel Task 10 found for GET /zone. Caseta v01.123's actual
# 200 response is `{"Facades": [...]}` (8 instances). RA3 v03.247 returns
# 204 NoContent on this route.
#
# /facade/{facadeId} IS fixture-covered, and this comment said otherwise
# until now. It was written when the only corpora were the two campaign
# captures, which reached the route only via the /zone/{zoneId}/facade
# sub-route -- a distinct, always-400 route. The coverage-blind spec probes
# request /facade/{1..8} directly, and Caseta answers all 8 with a body on
# both the v01.123 and the v01.124 bare-bridge corpus (RA3 v03.249 answers
# all 8 `404 NotFound`); the bodies are `{"Facade": {"href": ...,
# "FacingDirection": {"Degrees": N}}}`. So 16 observed Facade objects, not
# zero.
#
# The path is still left as generated, but now for a different reason: the
# generated schema already describes those bodies, and conformance validates
# all 16 against it without a deviation to record. The 8 facades a bare
# bridge ships are also why /facade is one of the routes docs/platforms.md
# names as answering 200 before any device exists.
/facade:
  get:
    operationId: getFacade
    tags:
      - facade
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Facades
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Facades"
    summary: List facades
/facade/{facadeId}:
  get:
    operationId: getFacadeID
    tags:
      - facade
    x-leap-communique-type: ReadRequest
    x-leap-body-type: Facade
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Facade"
    summary: Read facade
  parameters:
    - name: facadeId
      in: path
      required: true
      schema:
        type: string
