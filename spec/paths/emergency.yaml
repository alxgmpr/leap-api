# HAND-AUTHORED (probe-derived). The firmware route table has no
# `/emergency/...` route under that spelling; it records only the
# concatenation `/emergencystatus` (GET+SUBSCRIBE, responseType
# EmergencyStatus), one of the 51 concatenation-suspect spellings. The
# in-doubt sweep (2026-08-31, read-only, fixtures/spec-read-indoubt.json,
# RA3 v03.249) settled it: the concatenated form answers `400 "This request
# is not supported"`, `/emergency/status` answers `204 NoContent` — the
# route exists, and no body has ever been observed, so no response schema is
# asserted. Only the probed GET is declared; the extraction's SUBSCRIBE verb
# is unexercised.
/emergency/status:
  get:
    operationId: getEmergencyStatus
    tags:
      - emergency
    x-leap-communique-type: ReadRequest
    responses:
      "200":
        description: Success
    summary: Get emergency status
