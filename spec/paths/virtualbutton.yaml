# Refined from _generated/virtualbutton.yaml. One deviation from a
# straight copy:
#
# GET /virtualbutton: x-leap-body-type and the 200 schema were changed
# from `VirtualButton` (singular) to `VirtualButtons` (a new array schema).
# Same class of extraction mislabel Task 10 found for GET /zone. Caseta
# v01.123's actual 200 response is `{"VirtualButtons": [...]}`. RA3
# v03.247 returns 204 NoContent on this route.
/virtualbutton:
  post:
    operationId: createVirtualButton
    tags:
      - virtualbutton
    x-leap-communique-type: CreateRequest
    x-leap-body-type: VirtualButton
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualButton"
    summary: Create virtual button
  get:
    operationId: getVirtualButton
    tags:
      - virtualbutton
    x-leap-communique-type: ReadRequest
    x-leap-body-type: VirtualButtons
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualButtons"
    x-leap-subscribable: true
    x-leap-event-schema:
      $ref: "#/components/schemas/VirtualButton"
    summary: List all virtual buttons
/virtualbutton/{virtualbuttonId}:
  get:
    operationId: getVirtualButtonID
    tags:
      - virtualbutton
    x-leap-communique-type: ReadRequest
    x-leap-body-type: VirtualButton
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualButton"
    summary: Read virtual button
  put:
    operationId: updateVirtualButtonID
    tags:
      - virtualbutton
    x-leap-communique-type: UpdateRequest
    x-leap-body-type: VirtualButton
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualButton"
    summary: Update virtual button
  parameters:
    - name: virtualbuttonId
      in: path
      required: true
      schema:
        type: string
